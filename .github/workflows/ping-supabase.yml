name: Ping Supabase

on:
  schedule:
    # Jalan setiap hari, jam 00:00 UTC (07:00 WIB)
    - cron: '0 0 * * *'
  workflow_dispatch: # biar bisa dijalankan manual juga

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (query tabel spmb_settings)
        env:
          SUPABASE_URL: https://xrvkhamqarbtxismmxrs.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Secret SUPABASE_ANON_KEY belum diisi di GitHub (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          # -f : gagal jika HTTP status >= 400 (401/404 tidak lagi dianggap sukses)
          # --retry : coba ulang otomatis jika gangguan jaringan sesaat
          curl -fsS --retry 3 --retry-delay 10 --retry-all-errors --max-time 30 \
            -o /dev/null -w "HTTP %{http_code}\n" \
            "$SUPABASE_URL/rest/v1/spmb_settings?select=*&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
