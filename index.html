<style>
  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
  }
  /* Tabel dengan garis (grid) di semua sel */
  .grid-table { border-collapse: collapse; width: 100%; }
  .grid-table th, .grid-table td { border: 1px solid #cbd5e1; vertical-align: middle; }
  .grid-table thead th { border-color: #94a3b8; }
  .dark .grid-table th, .dark .grid-table td { border-color: #334155; }
  .dark .grid-table thead th { border-color: #475569; }
  .grid-table tbody tr:nth-child(even):not(.bg-rose-50) { background-color: rgba(148,163,184,.08); }
  
  /* Adaptive Glassmorphism Panels */
  .glass-panel {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(226, 232, 240, 0.9);
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
  }
  html.dark .glass-panel {
    background: rgba(15, 23, 42, 0.7);
    border: 1px solid rgba(30, 41, 59, 0.8);
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
  }

  .glass-card {
    background: #ffffff;
    backdrop-filter: blur(12px);
    border: 1px solid rgba(226, 232, 240, 0.9);
    box-shadow: 0 4px 12px -2px rgba(0, 0, 0, 0.03);
  }
  html.dark .glass-card {
    background: rgba(30, 41, 59, 0.5);
    border: 1px solid rgba(51, 65, 85, 0.6);
    box-shadow: 0 4px 12px -2px rgba(0, 0, 0, 0.2);
  }

  /* Adaptive Gradients */
  .gradient-text {
    background: linear-gradient(135deg, #0284c7 0%, #4338ca 50%, #7e22ce 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  html.dark .gradient-text {
    background: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .gradient-gold {
    background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
  }

  /* Transition for Carousel */
  .slide-fade {
    transition: opacity 0.6s ease-in-out, transform 0.6s ease-in-out;
  }

  /* Custom Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.4); border-radius: 999px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.7); }
  html.dark ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.3); }

  @media print {
    body { background: white !important; color: black !important; }
    .no-print { display: none !important; }
    .print-only { display: block !important; }
    .glass-panel { background: none !important; border: none !important; box-shadow: none !important; }
  }

  /* ===== Animasi pembuka: Sugeng Rawuh ===== */
  /* Catatan: sengaja TANPA filter:blur, backdrop-filter, dan background-clip:text agar tidak muncul kotak/bercak hitam di HP */
  #welcomeSplash { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; cursor: pointer; overflow: hidden;
    background: #059669; background-image: linear-gradient(135deg, #047857 0%, #059669 50%, #0d9488 100%); color: #fff; transition: opacity .6s ease, visibility .6s; }
  #welcomeSplash.out { opacity: 0; visibility: hidden; pointer-events: none; }
  #welcomeSplash .orb { position: absolute; border-radius: 9999px; opacity: .5; animation: wsFloat 7s ease-in-out infinite; }
  #welcomeSplash .orb.o1 { width: 300px; height: 300px; top: -90px; left: -90px; background: radial-gradient(circle, rgba(253,224,71,.55) 0%, rgba(253,224,71,0) 70%); }
  #welcomeSplash .orb.o2 { width: 380px; height: 380px; bottom: -120px; right: -100px; background: radial-gradient(circle, rgba(52,211,153,.6) 0%, rgba(52,211,153,0) 70%); animation-delay: -3s; }
  #welcomeSplash .orb.o3 { width: 220px; height: 220px; top: 55%; left: 62%; background: radial-gradient(circle, rgba(163,230,53,.5) 0%, rgba(163,230,53,0) 70%); animation-delay: -5s; }
  #welcomeSplash .ws-logo { width: 84px; height: 84px; border-radius: 24px; background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.35); display: flex; align-items: center; justify-content: center; margin-bottom: 22px;
    animation: wsPop .8s ease both; }
  #welcomeSplash .ws-logo.has-img { width: 112px; height: 112px; border-radius: 28px; background: #fff; padding: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
  #welcomeSplash .ws-logo img { width: 100%; height: 100%; object-fit: contain; display: none; }
  #welcomeSplash .ws-logo.has-img img { display: block; }
  #welcomeSplash .ws-logo.has-img svg { display: none; }
  #welcomeSplash .ws-hello { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 800; letter-spacing: -.02em; font-size: clamp(2.2rem, 8vw, 4rem); line-height: 1.1; text-shadow: 0 2px 12px rgba(0,0,0,.18); }
  #welcomeSplash .ws-hello span { display: inline-block; opacity: 0; animation: wsLetter .5s ease forwards; }
  #welcomeSplash .ws-brand { margin-top: 10px; font-weight: 800; font-size: clamp(1.4rem, 5.5vw, 2.4rem); letter-spacing: .18em; color: #fef08a; opacity: 0; text-shadow: 0 2px 12px rgba(0,0,0,.18); animation: wsFadeUp .8s ease 1.1s forwards; }
  #welcomeSplash .ws-sub { margin-top: 8px; font-size: .9rem; opacity: 0; color: rgba(255,255,255,.9); animation: wsFadeUp .8s ease 1.5s forwards; }
  #welcomeSplash .ws-bar { margin-top: 28px; width: 160px; height: 4px; border-radius: 9999px; background: rgba(255,255,255,.28); overflow: hidden; opacity: 0; animation: wsFadeUp .5s ease 1.6s forwards; }
  #welcomeSplash .ws-bar i { display: block; height: 100%; width: 0; background: #fff; border-radius: 9999px; animation: wsBar 2.2s ease-in-out 1.7s forwards; }
  #welcomeSplash .ws-skip { position: absolute; bottom: 22px; font-size: .7rem; letter-spacing: .08em; color: rgba(255,255,255,.75); opacity: 0; animation: wsFadeUp .6s ease 2s forwards; }
  @keyframes wsLetter { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  @keyframes wsFadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes wsPop { from { opacity: 0; transform: scale(.5); } to { opacity: 1; transform: none; } }
  @keyframes wsBar { to { width: 100%; } }
  @keyframes wsFloat { 0%,100% { transform: translate(0,0); } 50% { transform: translate(20px,-24px); } }
  @media (prefers-reduced-motion: reduce) { #welcomeSplash *, #welcomeSplash { animation-duration: .01s !important; animation-delay: 0s !important; } }
  @media print { #welcomeSplash { display: none !important; } }
</style>

(function () {
  var sp = document.getElementById('welcomeSplash'), h = document.getElementById('wsHello');
  if (!sp) return;
  // Huruf muncul satu per satu
  var d = 0;
  'Sugeng Rawuh'.split(' ').forEach(function (w, wi, arr) {
    var word = document.createElement('span'); word.style.cssText = 'display:inline-block;opacity:1;transform:none;animation:none;white-space:nowrap';
    w.split('').forEach(function (ch) {

    if (wi < arr.length - 1) { h.appendChild(document.createTextNode(' ')); d++; }

  var box = document.getElementById('wsLogo'), img = document.getElementById('wsLogoImg');

  img.src = window.SCHOOL_LOGO_B64;
  window.setSplashLogo = function (src) {
    if (!src || !box || !img) return;
    img.onload = function () { box.classList.add('has-img'); };
    img.onerror = function () { box.classList.remove('has-img'); };
    if (img.getAttribute('src') !== src) img.src = src;
  };
  var closed = false;
  function close() { if (closed) return; closed = true; sp.classList.add('out'); setTimeout(function () { sp.remove(); }, 800); }

  document.addEventListener('keydown', close, { once: true });
  setTimeout(close, 4200);

<script>
const LS_KEY = { theme: 'spmb_theme' };

// ==== Mode "Link Siswa" ====
// Jika halaman dibuka dengan ?mode=siswa (atau #siswa), hanya formulir pendaftaran yang tampil:
// menu Portal Panitia, Panel Admin, dan Pengaturan tidak dirender sama sekali.
const STUDENT_ONLY = new URLSearchParams(location.search).get('mode') === 'siswa' || location.hash === '#siswa';
function buildStudentLink() {
  return location.href.split('#')[0].split('?')[0] + '?mode=siswa';
}

// ==== Supabase connection ====
const SUPABASE_URL = 'https://xrvkhamqarbtxismmxrs.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_LRFBHokFnNO4SDSpqqywuw_oKyCwOao';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Tabel baru yang perlu dibuat di Supabase untuk fitur Data Guru/Siswa & Data Nama SMP:
//   create table spmb_lists (
//     id text primary key,
//     items jsonb default '[]'::jsonb
//   );
//   alter table spmb_lists enable row level security;
//   create policy "public read"  on spmb_lists for select using (true);
//   create policy "public write" on spmb_lists for all    using (true) with check (true);
// Baris akan otomatis terbuat (upsert) saat admin pertama kali klik "Simpan Perubahan"
// di tab Data Guru/Siswa atau Data SMP, tidak perlu insert manual.

// Agar tombol "Hapus" pendaftar berfungsi, tabel spmb_submissions perlu policy DELETE (jalankan sekali di SQL Editor Supabase):
//   create policy "public delete" on spmb_submissions for delete using (true);
// Kop dokumen (PNG) disimpan di spmb_lists id 'kop' (tabel yang sama, tidak perlu migrasi tambahan).
// Kolom baru yang perlu ditambahkan ke tabel spmb_submissions untuk fitur "Cabut Berkas/Keluar":
//   alter table spmb_submissions add column withdrawn boolean default false;

function initTheme() {
  const savedTheme = localStorage.getItem(LS_KEY.theme) || 'dark';
  setTheme(savedTheme);
}

function setTheme(theme) {
  const html = document.documentElement;
  const sunIcon = document.getElementById('sunIcon');
  const moonIcon = document.getElementById('moonIcon');

  if (theme === 'light') {
    html.classList.remove('dark');
    html.classList.add('light');
    localStorage.setItem(LS_KEY.theme, 'light');
    if (sunIcon) sunIcon.classList.add('hidden');
    if (moonIcon) moonIcon.classList.remove('hidden');
  } else {
    html.classList.remove('light');
    html.classList.add('dark');
    localStorage.setItem(LS_KEY.theme, 'dark');
    if (sunIcon) sunIcon.classList.remove('hidden');
    if (moonIcon) moonIcon.classList.add('hidden');
  }
}

function toggleTheme() {
  const current = localStorage.getItem(LS_KEY.theme) || 'dark';
  setTheme(current === 'dark' ? 'light' : 'dark');
}

// Local cache kept in sync with Supabase. Reads (getX) are synchronous and
// hit this cache; writes (saveX/addX/updateX) push to Supabase and patch the
// cache immediately so the UI stays responsive.
const cache = { settings: null, schema: null, subs: [], guruSiswa: [], smp: [], fee: null, kop: '', kepsek: [] };

function mapSettingsRow(r) {
  return {
    schoolName: r?.school_name ?? 'SMK Widya Mandala Tambak',
    year: r?.year ?? String(new Date().getFullYear()),
    formTitle: r?.form_title ?? 'Formulir Pendaftaran',
    logo: r?.logo ?? '',
    slides: (r?.slides && Array.isArray(r.slides) && r.slides.length) ? r.slides : defaultSlides()
  };
}
function defaultSlides() {
  return [
    { badge: 'Gedung & Fasilitas', title: 'Kampus Modern & Asri', desc: 'Dilengkapi ruang kelas ber-AC, perpus digital, sarana olahraga.', image: 'https://images.unsplash.com/photo-1523050854058-8df90110c9f1?auto=format&fit=crop&w=1200&q=80' },
    { badge: 'Teknologi Terkini', title: 'Praktikum Sains & IT', desc: 'Mendukung pembelajaran praktis interaktif berbasis teknologi.', image: 'https://images.unsplash.com/photo-1562774053-701939374585?auto=format&fit=crop&w=1200&q=80' }
  ];
}
function mapSubRow(r) {
  return { id: r.id, regNo: r.reg_no, data: r.data || {}, source: r.source || 'siswa', verified: !!r.verified, withdrawn: !!r.withdrawn, year: r.year, createdAt: r.created_at };
}

// ===== Akses data lewat fungsi database ber-sandi (lihat setup_keamanan.sql) =====
// Sandi hanya disimpan di sessionStorage tab ini (hilang saat tab ditutup) dan dikirim ke fungsi database untuk diverifikasi.
function authPass(level) {
  const a = sessionStorage.getItem('spmb_admin_pw') || '';
  if (level === 'admin') return a;
  return a || sessionStorage.getItem('spmb_panitia_pw') || '';
}
async function callRpc(fn, params) {
  const { data, error } = await supabaseClient.rpc(fn, params);
  if (error) throw error;
  return data;
}
function rpcFail(msg, e) {
  console.error(e);
  const denied = e && (e.code === '42501' || /Tidak berwenang/.test(e.message || ''));
  toast(denied ? 'Sesi login tidak valid / sandi berubah. Silakan keluar lalu masuk lagi.' : msg, 'error');
}
// Data privat (pendaftar, fee, kop, nomor WA) hanya dimuat setelah login panitia/admin
async function loadPrivate() {
  const pw = authPass('panitia');
  if (!pw) return;
  const [subs, priv] = await Promise.all([
    callRpc('spmb_list_submissions', { p_pass: pw }),
    callRpc('spmb_get_private', { p_pass: pw })
  ]);
  cache.subs = (subs || []).map(mapSubRow);
  const find = id => (priv || []).find(r => r.id === id);
  const fc = find('fee_config'), kp = find('kop'), ks = find('kepsek');
  cache.kop = (kp && Array.isArray(kp.items) && kp.items[0] && typeof kp.items[0].image === 'string') ? kp.items[0].image : '';
  cache.fee = (fc && Array.isArray(fc.items) && fc.items[0] && typeof fc.items[0] === 'object') ? fc.items[0] : null;
  cache.kepsek = (ks && Array.isArray(ks.items)) ? ks.items : [];
}
function clearPrivate() {
  cache.subs = []; cache.fee = null; cache.kop = ''; cache.kepsek = [];
}
function logoutSession(role) {
  sessionStorage.removeItem(`spmb_${role}_auth`); sessionStorage.removeItem(`spmb_${role}_pw`);
  if (!sessionStorage.getItem('spmb_admin_pw') && !sessionStorage.getItem('spmb_panitia_pw')) clearPrivate();
}

const DB = {
  getSettings: () => cache.settings || mapSettingsRow(null),
  saveSettings: function(s) {
    cache.settings = { ...cache.settings, ...s };
    callRpc('spmb_save_settings', { p_pass: authPass('admin'), p_patch: {
      school_name: s.schoolName, year: s.year, form_title: s.formTitle, logo: s.logo, slides: s.slides
    } }).catch(e => rpcFail('Gagal menyimpan pengaturan ke server', e));
  },
  getSchema: () => cache.schema && cache.schema.length ? cache.schema : defaultSchema(),
  saveSchema: function(f) {
    cache.schema = f;
    callRpc('spmb_save_schema', { p_pass: authPass('admin'), p_fields: f })
      .catch(e => rpcFail('Gagal menyimpan formulir ke server', e));
  },
  getSubmissions: () => cache.subs,
  addSubmission: async function(data, source) {
    const settings = this.getSettings();
    let row;
    try {
      if ((source || 'siswa') === 'siswa') row = await callRpc('spmb_submit', { p_data: data });
      else row = (await callRpc('spmb_add_submissions', { p_pass: authPass('panitia'), p_rows: [{ year: settings.year, data, source }] }))[0];
    } catch (error) { rpcFail('Gagal mengirim pendaftaran ke server', error); throw error; }
    const entry = mapSubRow(row);
    cache.subs.unshift(entry);
    return entry;
  },
  updateSubmission: function(id, patch) {
    const i = cache.subs.findIndex(x => x.id === id);
    if (i > -1) cache.subs[i] = { ...cache.subs[i], ...patch };
    const dbPatch = {};
    if ('data' in patch) dbPatch.data = patch.data;
    if ('verified' in patch) dbPatch.verified = patch.verified;
    if ('withdrawn' in patch) dbPatch.withdrawn = patch.withdrawn;
    callRpc('spmb_update_submission', { p_pass: authPass('panitia'), p_id: String(id), p_patch: dbPatch })
      .catch(e => rpcFail('Gagal menyimpan perubahan ke server', e));
    return cache.subs[i];
  },
  // Hapus permanen satu pendaftar (butuh policy DELETE di tabel spmb_submissions)
  deleteSubmission: async function(id) {
    let ok = false;
    try { ok = await callRpc('spmb_delete_submission', { p_pass: authPass('panitia'), p_id: String(id) }); }
    catch (error) { rpcFail('Gagal menghapus di server.', error); return false; }
    if (!ok) { toast('Gagal menghapus: data tidak ditemukan di server.', 'error'); return false; }
    cache.subs = cache.subs.filter(x => x.id !== id);
    const fc = this.getFeeConfig();
    if (id in fc.overrides && authPass('admin')) { delete fc.overrides[id]; this.saveFeeConfig(fc); } // bersihkan fee khusus milik pendaftar ini
    return true;
  },
  getYears: function() {
    const years = new Set(this.getSubmissions().map(s => s.year).filter(Boolean));
    years.add(this.getSettings().year);
    return Array.from(years).sort().reverse();
  },
  // Data referensi Guru/Siswa: dipakai field bertipe "Cari" untuk mencatat siapa yang membawa/mereferensikan pendaftar
  getGuruSiswaList: () => cache.guruSiswa || [],
  saveGuruSiswaList: function(items) {
    cache.guruSiswa = items;
    callRpc('spmb_save_list', { p_pass: authPass('admin'), p_id: 'guru_siswa', p_items: items })
      .catch(e => rpcFail('Gagal menyimpan Data Guru/Siswa ke server', e));
  },
  // Data referensi Nama SMP: dipakai field bertipe "Cari" untuk standarisasi asal sekolah
  // Pengaturan & nilai fee khusus per pendaftar (rekap fee sponsor): disimpan di spmb_lists id 'fee_config' (tanpa migrasi tabel)
  getFeeConfig: () => ({ ...feeDefaults(), ...(cache.fee || {}), overrides: { ...((cache.fee && cache.fee.overrides) || {}) } }),
  saveFeeConfig: function(c) {
    cache.fee = c;
    callRpc('spmb_save_list', { p_pass: authPass('admin'), p_id: 'fee_config', p_items: [c] })
      .catch(e => rpcFail('Gagal menyimpan pengaturan fee ke server', e));
  },
  // Gambar kop dokumen (PNG) untuk semua rekap/cetak: disimpan di spmb_lists id 'kop' (tanpa migrasi tabel)
  getKop: () => cache.kop || '',
  saveKop: function(dataUrl) {
    cache.kop = dataUrl || '';
    callRpc('spmb_save_list', { p_pass: authPass('admin'), p_id: 'kop', p_items: [{ image: cache.kop }] })
      .catch(e => rpcFail('Gagal menyimpan kop dokumen ke server', e));
  },
  // Nomor WhatsApp kepala sekolah (tujuan kirim rekap oleh panitia): spmb_lists id 'kepsek' (tanpa migrasi tabel)
  getKepsekList: () => cache.kepsek || [],
  saveKepsekList: function(items) {
    cache.kepsek = items;
    callRpc('spmb_save_list', { p_pass: authPass('admin'), p_id: 'kepsek', p_items: items })
      .catch(e => rpcFail('Gagal menyimpan nomor WhatsApp ke server', e));
  },
  getSmpList: () => cache.smp || [],
  saveSmpList: function(items) {
    cache.smp = items;
    callRpc('spmb_save_list', { p_pass: authPass('admin'), p_id: 'smp', p_items: items })
      .catch(e => rpcFail('Gagal menyimpan Data Nama SMP ke server', e));
  }
};

async function loadFromSupabase() {
  const [setRes, schemaRes, listsRes] = await Promise.all([
    supabaseClient.from('spmb_settings').select('*').eq('id', 1).single(),
    supabaseClient.from('spmb_schema').select('*').eq('id', 1).single(),
    supabaseClient.from('spmb_lists').select('*')   // hanya baris guru_siswa & smp yang boleh dibaca publik (RLS)
  ]);
  if (setRes.error || schemaRes.error) {
    console.error(setRes.error || schemaRes.error);
    throw new Error('supabase_load_failed');
  }
  cache.settings = mapSettingsRow(setRes.data);
  cache.subs = [];
  if (schemaRes.data && schemaRes.data.fields && schemaRes.data.fields.length) {
    cache.schema = schemaRes.data.fields;
  } else {
    cache.schema = defaultSchema(); // tampil saja; tersimpan ke server saat admin pertama kali menyimpan formulir
  }
  // Tabel spmb_lists bersifat opsional (baru): jika belum dibuat di Supabase, jangan gagalkan seluruh portal.
  if (!listsRes.error && Array.isArray(listsRes.data)) {
    const gs = listsRes.data.find(r => r.id === 'guru_siswa');
    const sm = listsRes.data.find(r => r.id === 'smp');
    cache.guruSiswa = (gs && Array.isArray(gs.items)) ? gs.items : [];
    cache.smp = (sm && Array.isArray(sm.items)) ? sm.items : [];
  } else {
    if (listsRes.error) console.warn('Tabel spmb_lists belum tersedia:', listsRes.error.message);
    cache.guruSiswa = []; cache.smp = []; cache.kepsek = [];
  }
}

function defaultSchema() {
  return [
    { id: 'nama', label: 'Nama Lengkap', type: 'text', required: true, visibility: 'all' },
    { id: 'nisn', label: 'NISN', type: 'text', required: true, visibility: 'all' },
    { id: 'ttl_tempat', label: 'Tempat Lahir', type: 'text', required: true, visibility: 'all' },
    { id: 'ttl_tanggal', label: 'Tanggal Lahir', type: 'date', required: true, visibility: 'all' },
    { id: 'gender', label: 'Jenis Kelamin', type: 'select', required: true, options: ['Laki-laki', 'Perempuan'], visibility: 'all' },
    { id: 'alamat', label: 'Alamat Lengkap', type: 'textarea', required: true, visibility: 'all' },
    { id: 'hp_ortu', label: 'No. HP Orang Tua/Wali', type: 'text', required: true, visibility: 'all' },
    { id: 'asal_sekolah', label: 'Asal Sekolah', type: 'text', required: true, visibility: 'all' },
    { id: 'jurusan', label: 'Pilihan Jurusan', type: 'select', required: true, options: ['IPA', 'IPS', 'Bahasa', 'Peminatan Khusus'], visibility: 'all' },
    { id: 'ukuran_seragam', label: 'Ukuran Seragam', type: 'select', required: false, options: ['S', 'M', 'L', 'XL', 'XXL'], visibility: 'panitia' },
    { id: 'terima_seragam', label: 'Terima Seragam', type: 'checkbox', required: false, visibility: 'panitia' }
  ];
}

// Field yang visibility-nya belum diset (data lama) dianggap 'all' (tampil utk pendaftar & panitia)
function fieldVisibility(f) { return f.visibility === 'panitia' ? 'panitia' : 'all'; }
// Field publik: field yang boleh tampil di formulir pendaftar (siswa)
function publicSchema(schema) { return schema.filter(f => fieldVisibility(f) !== 'panitia'); }

function el(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstChild; }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function toast(msg, type = 'info') {
  document.querySelectorAll('.toast-item').forEach(e => e.remove());
  const icon = type === 'success' ? '✓' : type === 'error' ? '✕' : 'ℹ';
  const t = el(`
    <div class="toast-item fixed bottom-6 right-6 z-50 flex items-center gap-3 px-5 py-3.5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 shadow-2xl transition-all duration-300 transform translate-y-0 opacity-100">
      <span class="w-7 h-7 rounded-full ${type==='error'?'bg-rose-100 dark:bg-rose-500/20 text-rose-600 dark:text-rose-400':type==='success'?'bg-emerald-100 dark:bg-emerald-500/20 text-emerald-600 dark:text-emerald-400':'bg-sky-100 dark:bg-sky-500/20 text-sky-600 dark:text-sky-400'} flex items-center justify-center font-bold text-xs">${icon}</span>
      <span class="text-sm font-medium text-slate-800 dark:text-slate-100">${msg}</span>
    </div>
  `);
  document.body.appendChild(t);
  setTimeout(() => { t.classList.add('opacity-0', 'translate-y-2'); setTimeout(() => t.remove(), 300); }, 2800);
}

// Dialog konfirmasi (promise). message = HTML yang sudah di-escape oleh pemanggil.
function confirmAction({ title, message, okLabel = 'Ya, Lanjutkan', tone = 'primary' }) {
  return new Promise(resolve => {
    const okCls = tone === 'danger' ? 'bg-rose-600 hover:bg-rose-700' : tone === 'success' ? 'bg-emerald-600 hover:bg-emerald-700' : 'bg-sky-600 hover:bg-sky-700';
    const ov = el(`
      <div class="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-slate-900/70">
        <div role="dialog" aria-modal="true" class="w-full max-w-sm rounded-2xl bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 shadow-2xl p-6 space-y-4">
          <h3 class="font-display text-lg font-bold text-slate-900 dark:text-white">${esc(title)}</h3>
          <p class="text-sm text-slate-700 dark:text-slate-200 leading-relaxed">${message}</p>
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" data-r="0" class="px-4 py-2 rounded-xl bg-slate-200 dark:bg-slate-700 text-slate-800 dark:text-slate-100 font-bold text-sm">Batal</button>
            <button type="button" data-r="1" class="px-4 py-2 rounded-xl ${okCls} text-white font-bold text-sm">${esc(okLabel)}</button>
          </div>
        </div>
      </div>`);
    const onKey = e => { if (e.key === 'Escape') done(false); };
    const done = v => { document.removeEventListener('keydown', onKey); ov.remove(); resolve(v); };
    ov.onclick = e => { if (e.target === ov) return done(false); const b = e.target.closest('button[data-r]'); if (b) done(b.dataset.r === '1'); };
    document.addEventListener('keydown', onKey);
    document.body.appendChild(ov);
    ov.querySelector('button[data-r="1"]').focus();
  });
}

// Bilah "Pilih semua + Hapus Terpilih" untuk Data Guru/Siswa & Data SMP
function bulkBarHtml() {
  return `<div class="flex flex-wrap items-center gap-3 p-3 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700">
    <label class="flex items-center gap-2 text-sm font-bold text-slate-800 dark:text-slate-100 cursor-pointer"><input type="checkbox" id="selAll" class="w-5 h-5 rounded accent-indigo-500 cursor-pointer"> Pilih semua</label>
    <span id="selInfo" class="text-xs font-semibold text-slate-700 dark:text-slate-300"></span>
    <button id="delSel" type="button" class="ml-auto px-3 py-1.5 rounded-lg bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs disabled:opacity-40 disabled:cursor-not-allowed">Hapus Terpilih</button>
  </div>`;
}
function syncBulkBar(wrap, visIdx, sel) {
  const n = visIdx.filter(i => sel.has(i)).length, all = wrap.querySelector('#selAll');
  all.checked = visIdx.length > 0 && n === visIdx.length;
  all.indeterminate = n > 0 && n < visIdx.length;
  all.disabled = !visIdx.length;
  wrap.querySelector('#selInfo').textContent = sel.size ? `${sel.size} dipilih` : '';
  const d = wrap.querySelector('#delSel');

function copyToClipboard(text) {
  const input = document.createElement('textarea');
  input.value = text; document.body.appendChild(input); input.select();

// Field "Cari" yang boleh diisi lebih dari satu (mis. beberapa sponsor). Nilai disimpan sebagai teks dipisah "; ".
// Field lama tanpa properti multi: otomatis multi bila sumbernya Data Guru/Siswa.
function isMultiCari(f) { return f.type === 'cari' && (typeof f.multi === 'boolean' ? f.multi : f.source === 'guru_siswa'); }
function splitMulti(v) { return String(v ?? '').split(';').map(x => x.trim()).filter(Boolean); }
function cariChipHtml(name) {
  return `<span class="cariChip inline-flex items-center gap-1.5 pl-3 pr-1.5 py-1 rounded-full bg-sky-100 dark:bg-sky-500/20 text-sky-700 dark:text-sky-300 text-sm font-semibold" data-val="${esc(name)}"><span>${esc(name)}</span><button type="button" class="cariChipX w-5 h-5 rounded-full hover:bg-sky-200 dark:hover:bg-sky-500/40 text-sky-700 dark:text-sky-300 font-bold leading-none" aria-label="Hapus">×</button></span>`;
}
function cariChosen(wrap) { return Array.from(wrap.querySelectorAll('.cariChip')).map(c => c.dataset.val); }
function cariSyncMulti(wrap) {
  const names = cariChosen(wrap);
  wrap.querySelector('input[type=hidden]').value = names.join('; ');
  wrap.querySelector('.cariInput').required = wrap.dataset.required === '1' && !names.length;
}
function cariAddChip(wrap, val) {
  val = String(val || '').trim().replace(/;/g, ',');
  const input = wrap.querySelector('.cariInput');
  if (!val) return;
  if (!cariChosen(wrap).some(n => n.toLowerCase() === val.toLowerCase())) {
    wrap.querySelector('.cariChips').appendChild(el(cariChipHtml(val)));
  }
  input.value = '';
  cariSyncMulti(wrap);
  wrap.querySelector('.cariDropdown').classList.add('hidden');
  input.focus();
}

const BULAN_ID = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
function renderFieldInput(f, value = '') {
  const req = f.required ? '<span class="text-rose-500 font-bold ml-1">*</span>' : '';
  const cmn = "w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-900/90 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500/50 focus:border-sky-500 transition-all text-sm";
  let input = '';

  if (f.type === 'heading') {
    return `<div class="md:col-span-2 pt-3 first:pt-0">
      <h3 class="text-base sm:text-lg font-display font-bold text-slate-800 dark:text-white border-b border-slate-200 dark:border-slate-800 pb-2">${esc(f.label)}</h3>
      ${f.desc ? `<p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-2">${esc(f.desc)}</p>` : ''}
    </div>`;
  }

  if (f.type === 'checkbox') {
    const checked = (value === true || value === 'true') ? 'checked' : '';
    return `<div class="space-y-1.5"><label class="flex items-center gap-3 p-3 rounded-xl bg-slate-50 dark:bg-slate-900/90 border border-slate-300 dark:border-slate-700 cursor-pointer select-none">
      <input type="checkbox" name="${f.id}" ${checked} class="w-5 h-5 rounded accent-amber-500 flex-shrink-0">
      <span class="text-sm font-semibold text-slate-700 dark:text-slate-300">${esc(f.label)} ${req}</span>
    </label></div>`;
  } else if (f.type === 'textarea') {
    input = `<textarea name="${f.id}" class="${cmn} min-h-[100px] resize-y" placeholder="Masukkan ${esc(f.label).toLowerCase()}..." ${f.required ? 'required' : ''}>${esc(value)}</textarea>`;
  } else if (f.type === 'select') {
    const opts = f.options || [];
    const isOther = f.allowOther && value && !opts.includes(value);
    const selVal = isOther ? '__OTHER__' : value;
    input = `
      <div class="space-y-2">
        <select name="${f.id}" class="selWithOther ${cmn}" ${f.required ? 'required' : ''}>
          <option value="">Pilih ${esc(f.label)}...</option>
          ${opts.map(o => `<option value="${esc(o)}" ${o === selVal ? 'selected' : ''}>${esc(o)}</option>`).join('')}
          ${f.allowOther ? `<option value="__OTHER__" ${selVal === '__OTHER__' ? 'selected' : ''}>Lainnya...</option>` : ''}
        </select>
        ${f.allowOther ? `<input type="text" name="${f.id}__other" class="otherInput ${selVal === '__OTHER__' ? '' : 'hidden'} ${cmn} mt-2" placeholder="Sebutkan..." value="${isOther ? esc(value) : ''}" ${(f.required && selVal === '__OTHER__') ? 'required' : ''}>` : ''}
      </div>`;
  } else if (f.type === 'cari' && isMultiCari(f)) {
    const chosen = splitMulti(value);
    input = `
      <div class="relative cariWrap" data-source="${esc(f.source || '')}" data-multi="1" data-required="${f.required ? '1' : '0'}">
        <input type="hidden" name="${f.id}" value="${esc(chosen.join('; '))}">
        <div class="cariChips flex flex-wrap gap-2 mb-2">${chosen.map(cariChipHtml).join('')}</div>
        <div class="flex gap-2">
          <input type="text" data-cari-for="${f.id}" autocomplete="off" class="cariInput ${cmn}" placeholder="Ketik untuk mencari ${esc(f.label).toLowerCase()}, lalu pilih atau tekan Enter..." ${(f.required && !chosen.length) ? 'required' : ''}>
          <button type="button" class="cariAddBtn px-4 rounded-xl bg-sky-500 hover:bg-sky-600 text-white font-bold text-sm flex-shrink-0">+ Tambah</button>
        </div>
        <p class="text-xs text-slate-400 mt-1">Boleh lebih dari satu. Tambahkan satu per satu.</p>
        <div class="cariDropdown hidden absolute z-30 mt-1 w-full max-h-56 overflow-y-auto rounded-xl bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 shadow-xl"></div>
      </div>`;
  } else if (f.type === 'cari') {
    input = `
      <div class="relative cariWrap" data-source="${esc(f.source || '')}">
        <input type="text" name="${f.id}" value="${esc(value)}" autocomplete="off" class="cariInput ${cmn}" placeholder="Ketik untuk mencari ${esc(f.label).toLowerCase()}..." ${f.required ? 'required' : ''}>
        <div class="cariDropdown hidden absolute z-30 mt-1 w-full max-h-56 overflow-y-auto rounded-xl bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 shadow-xl"></div>
      </div>`;
  } else if (f.type === 'bulan') {
    input = `<select name="${f.id}" class="${cmn}" ${f.required ? 'required' : ''}>
      <option value="">Pilih ${esc(f.label)}...</option>
      ${BULAN_ID.map(b => `<option value="${b}" ${b === value ? 'selected' : ''}>${b}</option>`).join('')}
    </select>`;
  } else if (f.type === 'angka' || f.type === 'hari') {
    input = `<input type="text" inputmode="numeric" pattern="[0-9]+" title="Hanya boleh diisi angka" autocomplete="off" data-angka="1" name="${f.id}" value="${esc(value)}" class="${cmn}" placeholder="Masukkan ${esc(f.label).toLowerCase()} (hanya angka)..." ${f.required ? 'required' : ''}>`;
  } else {
    input = `<input type="${f.type}" name="${f.id}" value="${esc(value)}" class="${cmn}" placeholder="Masukkan ${esc(f.label).toLowerCase()}..." ${f.required ? 'required' : ''}>`;
  }

  return `<div class="space-y-1.5"><label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider">${esc(f.label)} ${req}</label>${input}</div>`;
}

function drawCariDropdown(input) {
  const wrap = input.closest('.cariWrap');
  const dd = wrap.querySelector('.cariDropdown');
  const source = wrap.dataset.source;
  const q = input.value.trim().toLowerCase();
  const list = getMasterList(source);
  if (!list.length) {
    dd.innerHTML = `<div class="px-3 py-2.5 text-xs text-slate-400">Belum ada data pada ${esc(cariSourceLabel(source))}. Hubungi admin, atau isi manual sebagai teks.</div>`;
  } else {
    const chosen = wrap.dataset.multi === '1' ? cariChosen(wrap).map(n => n.toLowerCase()) : [];
    const pool = chosen.length ? list.filter(it => !chosen.includes((it.nama || '').toLowerCase())) : list;
    const matches = (q ? pool.filter(it => (it.nama || '').toLowerCase().includes(q)) : pool).slice(0, 8);
    dd.innerHTML = matches.length
      ? matches.map(it => `<button type="button" data-val="${esc(it.nama || '')}" class="cariOpt w-full text-left px-3 py-2 text-sm hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200">${cariItemDisplay(it, source)}</button>`).join('')
      : `<div class="px-3 py-2.5 text-xs text-slate-400">Tidak ditemukan. Anda tetap bisa mengisi teks bebas.</div>`;
  }
  dd.classList.remove('hidden');
}
document.addEventListener('input', e => { if (e.target.matches('.cariInput')) drawCariDropdown(e.target); });
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('.cariInput')) {
    const wrap = e.target.closest('.cariWrap');
    if (wrap && wrap.dataset.multi === '1') { e.preventDefault(); cariAddChip(wrap, e.target.value); }
  }
});
document.addEventListener('focusin', e => { if (e.target.matches('.cariInput')) drawCariDropdown(e.target); });
document.addEventListener('click', e => {
  const chipX = e.target.closest('.cariChipX');
  if (chipX) {
    const wrap = chipX.closest('.cariWrap');
    chipX.closest('.cariChip').remove();
    cariSyncMulti(wrap);
    return;
  }
  const addBtn = e.target.closest('.cariAddBtn');
  if (addBtn) {
    const wrap = addBtn.closest('.cariWrap');
    cariAddChip(wrap, wrap.querySelector('.cariInput').value);
    return;
  }
  const opt = e.target.closest('.cariOpt');
  if (opt) {
    const wrap = opt.closest('.cariWrap');
    if (wrap.dataset.multi === '1') { cariAddChip(wrap, opt.dataset.val); return; }
    wrap.querySelector('.cariInput').value = opt.dataset.val;
    wrap.querySelector('.cariDropdown').classList.add('hidden');
    return;
  }
  if (!e.target.closest('.cariWrap')) document.querySelectorAll('.cariDropdown').forEach(d => d.classList.add('hidden'));
});

// Field "Angka": hanya digit 0-9 (huruf, spasi, dan simbol otomatis dihapus, termasuk saat paste)
document.addEventListener('input', e => {
  const t = e.target;
  if (!t.matches || !t.matches('input[data-angka]')) return;
  const v = String(t.value).replace(/\D/g, '');
  if (t.value !== v) t.value = v;
});

document.addEventListener('change', e => {
  if (e.target.matches('select.selWithOther')) {
    const oInput = e.target.nextElementSibling;
    if (oInput && oInput.classList.contains('otherInput')) {
      const show = e.target.value === '__OTHER__';
      oInput.classList.toggle('hidden', !show);
      oInput.required = show && e.target.required;
      if (show) oInput.focus(); else oInput.value = '';
    }
  }
});

function collectForm(form, schema) {
  const fd = new FormData(form), data = {};
  schema.forEach(f => {
    if (f.type === 'heading') return;
    if (f.type === 'checkbox') { const el = form.querySelector(`[name="${f.id}"]`); data[f.id] = !!(el && el.checked); }
    else if (isMultiCari(f)) {
      // gabungkan chip yang sudah dipilih + teks yang masih diketik (belum ditekan Tambah)
      const names = splitMulti(fd.get(f.id));
      const pend = form.querySelector(`[data-cari-for="${f.id}"]`);
      const t = pend ? pend.value.trim().replace(/;/g, ',') : '';
      if (t && !names.some(n => n.toLowerCase() === t.toLowerCase())) names.push(t);
      data[f.id] = names.join('; ');
    }
    else if (f.type === 'select' && f.allowOther && fd.get(f.id) === '__OTHER__') data[f.id] = (fd.get(f.id + '__other') || '').trim();
    else data[f.id] = fd.get(f.id) || '';
  });
  return data;
}

function createSlideshowComponent(customSlides) {
  const slides = (customSlides && customSlides.length) ? customSlides : defaultSlides();
  let cIdx = 0, timer = null;

  const wrap = el(`
    <div class="relative w-full rounded-3xl overflow-hidden glass-panel mb-8 group">
      <div id="slideTrack" class="relative h-56 sm:h-72 w-full overflow-hidden">
        ${slides.map((s, i) => `
          <div class="slide-item absolute inset-0 w-full h-full transition-opacity duration-700 ${i === 0 ? 'opacity-100 z-10' : 'opacity-0 z-0'}">
            <img src="${esc(s.image)}" alt="${esc(s.title)}" class="w-full h-full object-cover">
            <div class="absolute inset-0 bg-gradient-to-t from-slate-900/95 via-slate-900/50 to-transparent flex flex-col justify-end p-6 sm:p-8">
              ${s.badge ? `<span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-bold bg-sky-500/90 text-white w-max mb-2">${esc(s.badge)}</span>` : ''}
              ${s.title ? `<h3 class="font-display text-xl sm:text-3xl font-extrabold text-white tracking-tight">${esc(s.title)}</h3>` : ''}
              ${s.desc ? `<p class="text-xs sm:text-sm text-slate-200 mt-1 max-w-xl">${esc(s.desc)}</p>` : ''}
            </div>
          </div>
        `).join('')}
      </div>
      <button id="prevSlide" class="absolute left-3 top-1/2 -translate-y-1/2 z-20 w-10 h-10 rounded-full bg-white/20 hover:bg-white/40 text-white backdrop-blur flex justify-center items-center opacity-0 group-hover:opacity-100 transition-all"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg></button>
      <button id="nextSlide" class="absolute right-3 top-1/2 -translate-y-1/2 z-20 w-10 h-10 rounded-full bg-white/20 hover:bg-white/40 text-white backdrop-blur flex justify-center items-center opacity-0 group-hover:opacity-100 transition-all"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/></svg></button>
      <div id="slideDots" class="absolute bottom-4 right-6 z-20 flex gap-2">
        ${slides.map((_, i) => `<button data-dot="${i}" class="w-2.5 h-2.5 rounded-full transition-all ${i===0?'bg-sky-400 w-7':'bg-white/50'}"></button>`).join('')}
      </div>
    </div>
  `);

  function go(i) {
    cIdx = (i + slides.length) % slides.length;
    wrap.querySelectorAll('.slide-item').forEach((e, idx) => { e.classList.toggle('opacity-100', idx===cIdx); e.classList.toggle('z-10', idx===cIdx); e.classList.toggle('opacity-0', idx!==cIdx); e.classList.toggle('z-0', idx!==cIdx); });
    wrap.querySelectorAll('[data-dot]').forEach((d, idx) => { d.className = idx===cIdx ? 'w-7 h-2.5 rounded-full bg-sky-400 transition-all' : 'w-2.5 h-2.5 rounded-full bg-white/50 transition-all'; });
  }
  function play() { clearInterval(timer); timer = setInterval(() => go(cIdx + 1), 4500); }
  
  wrap.querySelector('#prevSlide').onclick = () => { go(cIdx-1); play(); };
  wrap.querySelector('#nextSlide').onclick = () => { go(cIdx+1); play(); };
  wrap.querySelectorAll('[data-dot]').forEach(d => d.onclick = () => { go(parseInt(d.dataset.dot)); play(); });
  wrap.onmouseenter = () => clearInterval(timer); wrap.onmouseleave = play;
  play(); return wrap;
}

  function getFilteredSubs() {
    const all = DB.getSubmissions();
    return yearFilter === 'ALL' ? all : all.filter(s => s.year === yearFilter);
  }

  // Cari field berdasarkan id, lalu cadangan berdasarkan label (agar tetap jalan bila form diubah lewat Form Builder)
  function findField(ids, labelRe, types) {
    return schema.find(f => ids.includes(f.id) && types.includes(f.type)) ||
           schema.find(f => labelRe.test(f.label || '') && types.includes(f.type));
  }

  function drawStats() {
    const subs = getFilteredSubs();
    // Pendaftar yang cabut berkas/keluar tidak dihitung sebagai pendaftar aktif
    const activeSubs = subs.filter(s => !s.withdrawn);
    const withdrawnCount = subs.length - activeSubs.length;
    const totalAll = subs.length; // Total Pendaftar = pendaftar aktif + cabut berkas/keluar
    const vCount = activeSubs.filter(s => s.verified).length, pCount = activeSubs.length - vCount;

    const uniformFld = findField(['terima_seragam'], /seragam/i, ['checkbox']);
    const isYes = v => v === true || v === 'true';
    const uniYes = uniformFld ? activeSubs.filter(s => isYes(s.data[uniformFld.id])).length : 0;
    const uniNo = activeSubs.length - uniYes;

    const cards = [
      {t:'Total Pendaftar', v:totalAll, c:'indigo', n:`${activeSubs.length} aktif + ${withdrawnCount} cabut berkas/keluar`},
      {t:'Jumlah Pendaftar', v:activeSubs.length, c:'sky', n:'tidak termasuk yang cabut berkas/keluar'},
      {t:'Belum Terverifikasi', v:pCount, c:'amber', n:`${vCount} sudah terverifikasi`},
      {t:'Cabut Berkas / Keluar', v:withdrawnCount, c:'rose'}
    ];
    if (uniformFld) {
      cards.push({t:'Sudah Terima Seragam', v:uniYes, c:'teal', n:`dari ${activeSubs.length} pendaftar aktif`});
      cards.push({t:'Belum Terima Seragam', v:uniNo, c:'orange', n:`dari ${activeSubs.length} pendaftar aktif`});
    }
    wrap.querySelector('#statCards').innerHTML = cards.map(x => `
      <div class="glass-card rounded-2xl p-5 border-l-4 border-l-${x.c}-500 flex justify-between items-center">
        <div><p class="text-xs font-bold uppercase text-slate-500">${x.t}</p><p class="font-display text-3xl font-black text-slate-900 dark:text-white mt-1">${x.v}</p>${x.n ? `<p class="text-xs text-slate-400 mt-0.5">${x.n}</p>` : ''}</div>
      </div>
    `).join('');

    // Kartu rekap per pilihan: Jenis Kelamin & Pilihan Jurusan (dihitung dari pendaftar aktif)
    const breakdownCards = [];
    const rowHtml = (label, v, cls) => `
      <div class="flex justify-between items-center text-sm py-1.5 border-b border-slate-100 dark:border-slate-800 last:border-0">
        <span class="${cls || 'text-slate-600 dark:text-slate-300'}">${esc(label)}</span>
        <span class="font-bold ${cls ? 'text-slate-400' : 'text-slate-900 dark:text-white'}">${v}</span>
      </div>`;
    function addBreakdown(f, title) {
      if (!f) return;
      const counts = {};
      (f.options || []).forEach(o => counts[o] = 0);
      let other = 0, empty = 0;
      activeSubs.forEach(s => {
        const val = s.data[f.id];
        if (!val) { empty++; return; }
        if (val in counts) counts[val]++; else other++;
      });
      const rows = Object.entries(counts).map(([l, v]) => rowHtml(l, v)).join('') +
        (other ? rowHtml('Lainnya', other) : '') +
        (empty ? rowHtml('Belum diisi', empty, 'text-slate-400 italic') : '') +
        `<div class="flex justify-between items-center text-sm pt-2 mt-1 border-t border-slate-200 dark:border-slate-700 font-bold text-slate-900 dark:text-white"><span>Total</span><span>${activeSubs.length}</span></div>`;
      breakdownCards.push(`
        <div class="glass-card rounded-2xl p-5">
          <p class="text-xs font-bold uppercase text-slate-500 mb-2">${title}</p>
          ${rows}
        </div>`);
    }
    addBreakdown(findField(['gender'], /jenis\s*kelamin|gender/i, ['select']), 'Rekap Jenis Kelamin');
    addBreakdown(findField(['jurusan'], /jurusan/i, ['select']), 'Rekap Pilihan Jurusan');

    wrap.querySelector('#breakdownCards').innerHTML = breakdownCards.join('');
    drawGuru();
  }

  // ===== Rekap per Guru: berapa siswa yang dibawa setiap guru =====
  function guruCompute() {
    const fields = schema.filter(f => f.type === 'cari' && f.source === 'guru_siswa');
    const lookup = feeJenisLookup();
    const act = getFilteredSubs().filter(s => !s.withdrawn)
      .slice().sort((a, b) => String(a.createdAt || '').localeCompare(String(b.createdAt || '')));
    const map = new Map();
    // Semua guru terdaftar masuk daftar (agar yang belum membawa siswa tetap terlihat)
    DB.getGuruSiswaList().forEach(it => {
      const nama = String(it.nama || '').trim(), k = nama.toLowerCase();
      if (!k || String(it.jenis || '').toLowerCase().startsWith('sis') || map.has(k)) return;
      map.set(k, { nama, ket: String(it.ket || '').trim(), registered: true, items: [] });
    });
    let withGuru = 0;
    act.forEach(s => {
      const seen = new Set();
      fields.forEach(f => splitMulti(s.data ? s.data[f.id] : '').forEach(nama => {
        const k = nama.toLowerCase();
        if (seen.has(k)) return; seen.add(k);
        const info = lookup.get(k);
        if (info && info.jenis === 'Siswa') return; // sponsor siswa tidak masuk rekap guru
        if (!map.has(k)) map.set(k, { nama, ket: '', registered: false, items: [] });
        map.get(k).items.push(s);
      }));
      if ([...seen].some(k => { const e = map.get(k); return e && e.items.includes(s); })) withGuru++;
    });
    const list = Array.from(map.values()).sort((a, b) => b.items.length - a.items.length || a.nama.localeCompare(b.nama, 'id'));
    return { fields, list, totalAktif: act.length, withGuru };
  }
  function guruRowsAoa(c) {
    const rows = c.list.filter(g => g.items.length).map((g, i) => [i + 1, g.nama, g.ket, g.items.length,
      g.items.map(s => `${s.regNo || ''} ${s.data.nama || '-'}`.trim()).join('; ')]);
    return [['No', 'Nama Guru', 'Keterangan', 'Jumlah Siswa Dibawa', 'Daftar Siswa'], ...rows];
  }
  function drawGuru() {
    const body = wrap.querySelector('#guruBody');
    if (!body) return;
    const c = guruCompute();
    const zero = wrap.querySelector('#guruZero').checked, t = wrap.querySelector('#guruQ').value.trim().toLowerCase();
    const aktifGuru = c.list.filter(g => g.items.length);
    const totalBawa = aktifGuru.reduce((a, g) => a + g.items.length, 0);
    const card = (l, v, n) => `<div class="glass-card rounded-2xl p-5 border-l-4 border-l-amber-500"><p class="text-xs font-bold uppercase text-slate-500">${l}</p><p class="font-display text-3xl font-black text-slate-900 dark:text-white mt-1">${v}</p>${n ? `<p class="text-xs text-slate-400 mt-0.5">${n}</p>` : ''}</div>`;
    wrap.querySelector('#guruCards').innerHTML =
      card('Guru Membawa Siswa', aktifGuru.length, `dari ${c.list.length} guru terdata`) +
      card('Pendaftar Dibawa Guru', c.withGuru, `dari ${c.totalAktif} pendaftar aktif`) +
      card('Pendaftar Tanpa Guru', c.totalAktif - c.withGuru) +
      card('Total Hitungan', totalBawa, 'siswa yang dibawa 2+ guru dihitung di tiap guru');
    if (!c.fields.length) { body.innerHTML = `<div class="text-center py-10 text-slate-500 text-sm">Belum ada field bertipe "Cari" dari Data Guru/Siswa di Form Builder, jadi belum ada data guru pembawa siswa.</div>`; return; }
    const shown = c.list.filter(g => (zero || g.items.length) &&
      (!t || g.nama.toLowerCase().includes(t) || g.items.some(s => String(s.data.nama || '').toLowerCase().includes(t))));
    if (!shown.length) { body.innerHTML = `<div class="text-center py-10 text-slate-500 text-sm">Belum ada guru yang membawa siswa pada filter ini.</div>`; return; }
    body.innerHTML = `<div class="overflow-x-auto rounded-2xl border border-slate-200 dark:border-slate-800"><table class="w-full text-left text-sm">
      <thead class="bg-slate-100 dark:bg-slate-900 text-slate-600 dark:text-slate-400 font-bold uppercase text-xs"><tr><th class="p-3">No</th><th class="p-3">Nama Guru</th><th class="p-3 text-right">Jumlah Siswa</th><th class="p-3">Daftar Siswa</th></tr></thead>
      <tbody class="divide-y divide-slate-200 dark:divide-slate-800 text-slate-700 dark:text-slate-200">
      ${shown.map((g, i) => `<tr class="align-top"><td class="p-3">${i + 1}</td>
        <td class="p-3 font-bold">${esc(g.nama)}${g.ket ? ` <span class="text-xs font-normal text-slate-400">${esc(g.ket)}</span>` : ''}${g.registered ? '' : ' <span class="text-xs font-normal text-amber-600 dark:text-amber-400">(belum ada di Data Guru/Siswa)</span>'}</td>
        <td class="p-3 text-right font-black text-lg">${g.items.length}</td>
        <td class="p-3 text-xs">${g.items.length ? `<details><summary class="cursor-pointer text-sky-600 dark:text-sky-400 font-bold">Lihat ${g.items.length} siswa</summary><ol class="mt-1 list-decimal ml-4 space-y-0.5">${g.items.map(s => `<li>${esc(s.data.nama || '-')} <span class="text-slate-400">${esc(s.regNo || '')}</span></li>`).join('')}</ol></details>` : '<span class="text-slate-400">-</span>'}</td></tr>`).join('')}
      </tbody>
      <tfoot class="bg-slate-50 dark:bg-slate-900 font-bold"><tr><td class="p-3" colspan="2">TOTAL</td><td class="p-3 text-right">${shown.reduce((a, g) => a + g.items.length, 0)}</td><td></td></tr></tfoot>
    </table></div>`;
  }
  wrap.querySelector('#guruQ').oninput = drawGuru;
  wrap.querySelector('#guruZero').onchange = drawGuru;
  wrap.querySelector('#guruXls').onclick = () => {
    const c = guruCompute();
    if (!c.list.some(g => g.items.length)) { toast('Belum ada guru yang membawa siswa', 'error'); return; }
    const ya = yearFilter === 'ALL' ? 'Semua' : String(yearFilter).replace(/[\/\\]/g, '-');
    buildAndDownloadXlsx(guruRowsAoa(c), 'Rekap per Guru', `Rekap_Siswa_per_Guru_${ya}.xlsx`);
  };

  // ===== Kirim rekap ke WhatsApp (kepala sekolah) =====
  // Memakai tautan wa.me: WhatsApp terbuka dengan pesan siap kirim; panitia tinggal menekan Kirim. Hanya angka rekap, tanpa data pribadi siswa.
  function buildRekapText() {
    const subs = getFilteredSubs(), act = subs.filter(s => !s.withdrawn);
    const st = DB.getSettings();
    const isYes = v => v === true || v === 'true';
    const vCount = act.filter(s => s.verified).length;
    const lines = [];
    lines.push('*REKAP PENDAFTARAN SPMB*');
    lines.push(st.schoolName || '');
    lines.push('Tahun Ajaran: ' + (yearFilter === 'ALL' ? 'Semua Tahun Ajaran' : yearFilter));
    lines.push('Per ' + new Date().toLocaleString('id-ID', { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' }).replace(/\./g, ':').replace(',', ' pukul') + ' WIB');
    lines.push('');
    lines.push('Pendaftar aktif: *' + act.length + '*');
    lines.push('Terverifikasi: ' + vCount + ' | Belum: ' + (act.length - vCount));
    lines.push('Cabut berkas/keluar: ' + (subs.length - act.length));
    lines.push('Total masuk (aktif + cabut): ' + subs.length);
    const uni = findField(['terima_seragam'], /seragam/i, ['checkbox']);
    if (uni) { const y = act.filter(s => isYes(s.data[uni.id])).length; lines.push('Seragam: sudah terima ' + y + ' | belum ' + (act.length - y)); }
    const addBreak = (f, title) => {
      if (!f) return;
      const counts = {}; (f.options || []).forEach(o => counts[o] = 0);
      let other = 0, empty = 0;
      act.forEach(s => { const v = s.data[f.id]; if (!v) { empty++; return; } if (v in counts) counts[v]++; else other++; });
      lines.push(''); lines.push('*' + title + '*');
      Object.entries(counts).forEach(([l, v]) => lines.push('- ' + l + ': ' + v));
      if (other) lines.push('- Lainnya: ' + other);
      if (empty) lines.push('- Belum diisi: ' + empty);
    };
    addBreak(findField(['gender'], /jenis\s*kelamin|gender/i, ['select']), 'Jenis Kelamin');
    addBreak(findField(['jurusan'], /jurusan/i, ['select']), 'Pilihan Jurusan');
    lines.push(''); lines.push('Dikirim oleh Panitia SPMB.');
    return lines.join('\n');
  }
  // Teks WhatsApp rekap siswa per guru. Default hanya jumlah; nama siswa opsional.
  function buildGuruText(withNames) {
    const c = guruCompute(), st = DB.getSettings();
    const list = c.list.filter(g => g.items.length);
    const lines = [];
    lines.push('*REKAP SISWA YANG DIBAWA GURU - SPMB*');
    lines.push(st.schoolName || '');
    lines.push('Tahun Ajaran: ' + (yearFilter === 'ALL' ? 'Semua Tahun Ajaran' : yearFilter));
    lines.push('Per ' + new Date().toLocaleString('id-ID', { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' }).replace(/\./g, ':').replace(',', ' pukul') + ' WIB');
    lines.push('');
    lines.push('Guru membawa siswa: *' + list.length + '*');
    lines.push('Pendaftar dibawa guru: ' + c.withGuru + ' dari ' + c.totalAktif + ' pendaftar aktif');
    lines.push('Pendaftar tanpa guru: ' + (c.totalAktif - c.withGuru));
    lines.push('');
    if (!list.length) lines.push('Belum ada guru yang membawa siswa.');
    list.forEach((g, i) => {
      lines.push((i + 1) + '. ' + g.nama + ': *' + g.items.length + '* siswa');
      if (withNames) g.items.forEach(s => lines.push('    - ' + (s.data.nama || '-')));
    });
    lines.push(''); lines.push('Dikirim oleh Panitia SPMB.');
    return lines.join('\n');
  }

  // Modal detail: menampilkan seluruh data inputan pendaftar (semua field formulir + info pendaftaran)
  function showDetail(entry) {
    const fmtVal = (f, v) => {
      if (f.type === 'checkbox') return (v === true || v === 'true') ? 'Ya' : 'Belum';
      if (v === undefined || v === null || v === '') return '';
      if (f.type === 'date' && /^\d{4}-\d{2}-\d{2}/.test(String(v))) {
        const d = new Date(v); if (!isNaN(d)) return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
      }
      return String(v);
    };
    const item = (label, val, wide) => `
      <div class="${wide ? 'sm:col-span-2 ' : ''}p-3 rounded-xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700">
        <p class="text-[11px] font-bold uppercase tracking-wide text-slate-500 dark:text-slate-400">${esc(label)}</p>
        <p class="text-sm font-semibold text-slate-900 dark:text-white mt-0.5 whitespace-pre-line break-words">${val ? esc(val) : '<span class="text-slate-400 italic font-normal">Belum diisi</span>'}</p>
      </div>`;
    const known = new Set(schema.map(f => f.id));
    let body = '';
    schema.forEach(f => {
      if (f.type === 'heading') {
        body += `<h4 class="sm:col-span-2 pt-2 text-sm font-display font-bold text-slate-800 dark:text-white border-b border-slate-200 dark:border-slate-700 pb-1">${esc(f.label)}</h4>`;
        return;
      }
      body += item(f.label, fmtVal(f, entry.data[f.id]), f.type === 'textarea' || f.type === 'cari');
    });
    // Data lama yang field-nya sudah tidak ada di formulir tetap ditampilkan
    const extra = Object.keys(entry.data || {}).filter(k => !known.has(k) && !k.endsWith('__other'));
    if (extra.length) {
      body += `<h4 class="sm:col-span-2 pt-2 text-sm font-display font-bold text-slate-800 dark:text-white border-b border-slate-200 dark:border-slate-700 pb-1">Data Lainnya</h4>`;
      extra.forEach(k => { const v = entry.data[k]; body += item(k, typeof v === 'boolean' ? (v ? 'Ya' : 'Belum') : (v == null ? '' : String(v)), true); });
    }
    const status = entry.withdrawn ? 'Cabut Berkas/Keluar' : (entry.verified ? 'Terverifikasi' : 'Pending (belum terverifikasi)');
    const info =
      item('No. Pendaftaran', entry.regNo) + item('Tahun Ajaran', entry.year) +
      item('Status', status) + item('Sumber Input', entry.source === 'panitia' ? 'Diinput panitia' : 'Pendaftaran online (siswa)') +
      item('Tanggal Daftar', entry.createdAt ? new Date(entry.createdAt).toLocaleString('id-ID') : '');

    const ov = el(`
      <div class="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-slate-900/70">
        <div role="dialog" aria-modal="true" class="w-full max-w-3xl max-h-[90vh] flex flex-col rounded-2xl bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 shadow-2xl">

            <div>
              <p class="text-xs font-bold uppercase text-slate-500">Detail Pendaftar</p>
              <h3 class="font-display text-xl font-bold text-slate-900 dark:text-white">${esc(entry.data.nama || '-')}</h3>
            </div>
            <button type="button" data-x="close" class="text-2xl leading-none text-slate-400 hover:text-slate-700 dark:hover:text-slate-200" aria-label="Tutup">&times;</button>
          </div>
          <div class="p-5 overflow-y-auto space-y-5">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">${info}</div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">${body}</div>
          </div>
          <div class="flex justify-end gap-2 p-4 border-t border-slate-200 dark:border-slate-800">
            <button type="button" data-x="edit" class="px-4 py-2 rounded-xl bg-slate-200 dark:bg-slate-700 text-slate-800 dark:text-slate-100 font-bold text-sm">Edit</button>
            <button type="button" data-x="close" class="px-4 py-2 rounded-xl bg-sky-600 hover:bg-sky-700 text-white font-bold text-sm">Tutup</button>
          </div>
        </div>
      </div>`);
    const onKey = e => { if (e.key === 'Escape') close(); };
    const close = () => { document.removeEventListener('keydown', onKey); ov.remove(); };
    ov.onclick = e => {
      if (e.target === ov) return close();
      const b = e.target.closest('button[data-x]'); if (!b) return;
      close();
      if (b.dataset.x === 'edit') openForm(entry);

      if (k.startsWith('f:')) { const v = s.data ? s.data[k.slice(2)] : ''; return v === true || v === 'true' ? '1' : (v === false || v === undefined || v === null || v === 'false') ? '2' : String(v); }

        .sort((x, y) => {

      table.querySelector('#rows').innerHTML = vis.map(s => `

        if(!ok) return;
        DB.updateSubmission(entry.id, {verified: to}); drawRows(); drawStats();
        toast(to ? 'Pendaftar terverifikasi' : 'Verifikasi dibatalkan', 'success');
      }
      if(b.dataset.act==='w') {
        const to = !entry.withdrawn;
        const ok = await confirmAction(to
          ? { title: 'Cabut berkas / keluar?', message: `${who} akan ditandai <b>Cabut Berkas/Keluar</b> dan tidak lagi dihitung sebagai pendaftar aktif maupun dalam rekap fee sponsor.`, okLabel: 'Ya, Cabut Berkas', tone: 'danger' }
          : { title: 'Aktifkan kembali pendaftar?', message: `${who} akan dihitung lagi sebagai <b>pendaftar aktif</b>.`, okLabel: 'Ya, Aktifkan', tone: 'success' });
        if(!ok) return;
        DB.updateSubmission(entry.id, {withdrawn: to}); drawRows(); drawStats();
        toast(to ? 'Pendaftar ditandai cabut berkas/keluar' : 'Pendaftar diaktifkan kembali', 'success');
      }
      if(b.dataset.act==='d') {
        const ok = await confirmAction({ title: 'Hapus pendaftar secara permanen?', message: `${who} akan <b>dihapus permanen</b> beserta seluruh isian formulirnya dan tidak bisa dikembalikan.<br><span class="text-xs text-slate-500 dark:text-slate-400">Jika hanya ingin mengeluarkan dari hitungan, gunakan Cabut Berkas/Keluar.</span>`, okLabel: 'Ya, Hapus Permanen', tone: 'danger' });
        if(!ok) return;
        if(await DB.deleteSubmission(entry.id)) { drawRows(); drawStats(); toast('Pendaftar dihapus', 'success'); }
      }
      if(b.dataset.toggle) {
        const fid = b.dataset.toggle, fld = schema.find(f => f.id === fid);
        const cur = entry.data[fid] === true || entry.data[fid] === 'true';
        const ok = await confirmAction({ title: `Ubah ${fld ? fld.label : 'status'}?`, message: `${esc(fld ? fld.label : 'Status')} untuk ${who} akan diubah menjadi <b>${cur ? 'Belum' : 'Ya'}</b>.`, okLabel: 'Ya, Ubah', tone: 'primary' });
        if(!ok) return;
        DB.updateSubmission(entry.id, {data: { ...entry.data, [fid]: !cur }});
        drawRows(); drawStats();
        toast('Perubahan tersimpan', 'success');
      }
    };
    drawRows(); wrap.querySelector('#pContent').replaceChildren(table);
  }
  drawStats();
  renderList();
  setPtab('rekap');
  document.getElementById('app').replaceChildren(wrap);
}

// ===== WhatsApp: normalisasi nomor & Panel Admin "Nomor WA Kepsek" =====
// 0812xxxx / 812xxxx / +62812xxxx / 62 812-xxxx  ->  62812xxxx (format wa.me). Mengembalikan '' bila tidak valid.
function normalizeWaNumber(raw) {
  let d = String(raw || '').replace(/\D/g, '');
  if (!d) return '';
  if (d.startsWith('00')) d = d.slice(2);
  if (d.startsWith('0')) d = '62' + d.slice(1);
  else if (d.startsWith('8')) d = '62' + d;
  return (d.length >= 10 && d.length <= 15) ? d : '';
}
function renderKepsekAdmin(container) {

  if (!items.length) items = [{ nama: 'Kepala Sekolah', nomor: '' }];

    wrap.querySelector('#kRows').innerHTML = items.map((it, i) => {

    }).join('');
  }
  wrap.querySelector('#kRows').oninput = e => {

    items[Number(t.dataset.i)][t.dataset.k] = t.value;
  };
  wrap.querySelector('#kRows').onchange = () => draw(); // perbarui keterangan validasi setelah selesai mengetik
  wrap.querySelector('#kRows').onclick = e => {
    const b = e.target.closest('[data-del]'); if (!b) return;
    items.splice(Number(b.dataset.del), 1); if (!items.length) items.push({ nama: 'Kepala Sekolah', nomor: '' }); draw();

    const clean = items.map(x => ({ nama: String(x.nama || '').trim(), nomor: String(x.nomor || '').trim() })).filter(x => x.nama || x.nomor);

    items = clean.length ? clean : [{ nama: 'Kepala Sekolah', nomor: '' }];
    DB.saveKepsekList(clean); draw();

    const listEl = wrap.querySelector('#list');

      handle.onpointerdown = e => {
        e.preventDefault();
        const rowEl = handle.closest('.field-row');
        if (!rowEl) return;
        const listRows = () => Array.from(listEl.querySelectorAll('.field-row'));
        rowEl.setPointerCapture(e.pointerId);
        rowEl.classList.add('shadow-xl', 'ring-2', 'ring-indigo-400', 'relative', 'z-10', 'opacity-90');
        document.body.style.userSelect = 'none';

        function renumber() {
          listRows().forEach((r, idx) => {
            const numEl = r.querySelector('.field-num');
            if (numEl) numEl.textContent = idx + 1;
          });
        }

        function onMove(ev) {
          const y = ev.clientY;
          const others = listRows().filter(r => r !== rowEl);
          // Cari langsung posisi tujuan berdasarkan titik tengah setiap baris lain,
          // supaya field bisa "dilempar" ke posisi manapun dalam satu gerakan (tidak selangkah-selangkah).
          let target = others.find(sib => y < (sib.getBoundingClientRect().top + sib.getBoundingClientRect().height / 2));
          if (target) {
            if (target.previousElementSibling !== rowEl) listEl.insertBefore(rowEl, target);
          } else if (listEl.lastElementChild !== rowEl) {
            listEl.appendChild(rowEl);
          }
          renumber();
        }

        function onUp(ev) {
          rowEl.releasePointerCapture(ev.pointerId);
          rowEl.classList.remove('shadow-xl', 'ring-2', 'ring-indigo-400', 'relative', 'z-10', 'opacity-90');
          document.body.style.userSelect = '';
          rowEl.removeEventListener('pointermove', onMove);
          rowEl.removeEventListener('pointerup', onUp);
          rowEl.removeEventListener('pointercancel', onUp);
          const newOrderIds = listRows().map(r => r.dataset.fieldId);
          const changed = newOrderIds.some((id, idx) => schema[idx] && schema[idx].id !== id);
          if (changed) {
            schema = newOrderIds.map(id => schema.find(f => f.id === id));
            DB.saveSchema(schema);
            toast('Urutan diperbarui', 'success');
          }
          draw();
        }

        rowEl.addEventListener('pointermove', onMove);
        rowEl.addEventListener('pointerup', onUp);
        rowEl.addEventListener('pointercancel', onUp);
      };
    });
  }

    function syncOptVisibility() {

      overlay.querySelector('#sourceWrap').classList.toggle('hidden', typeSel.value !== 'cari');
      overlay.querySelector('#descWrap').classList.toggle('hidden', !isHeading);
      overlay.querySelector('#requiredWrap').classList.toggle('hidden', isHeading);

      overlay.querySelector('#fLabel').placeholder = isHeading ? 'Contoh: Data Orang Tua/Wali' : 'Contoh: Ukuran Seragam';
    }
    syncOptVisibility();
    typeSel.onchange = syncOptVisibility;

    overlay.querySelector('#closeX').onclick = () => overlay.remove();
    overlay.querySelector('#cancelBtn').onclick = () => overlay.remove();
    overlay.onclick = e => { if (e.target === overlay) overlay.remove(); };

    overlay.querySelector('#saveBtn').onclick = () => {
      const label = overlay.querySelector('#fLabel').value.trim();
      if (!label) { toast('Label pertanyaan tidak boleh kosong', 'error'); return; }
      const type = typeSel.value;
      const required = type === 'heading' ? false : overlay.querySelector('#fRequired').checked;
      const visibility = overlay.querySelector('input[name="fVis"]:checked').value;
      let options = [], allowOther = false, source = '', desc = '';
      if (type === 'select') {
        options = overlay.querySelector('#fOpts').value.split('\n').map(x => x.trim()).filter(Boolean);
        if (!options.length) { toast('Tambahkan minimal satu pilihan jawaban', 'error'); return; }
        allowOther = overlay.querySelector('#fAllowOther').checked;
      }
      let multi = false;
      if (type === 'cari') { source = overlay.querySelector('#fSource').value; multi = overlay.querySelector('#fMulti').checked; }
      if (type === 'heading') { desc = overlay.querySelector('#fDesc').value.trim(); }
      const newField = { id: f.id, label, type, required, visibility, options, allowOther, source, multi, desc };
      if (isNew) schema.push(newField);
      else { const idx = schema.findIndex(x => x.id === f.id); schema[idx] = newField; }
      DB.saveSchema(schema); draw(); overlay.remove();
      toast('Field tersimpan', 'success');
    };

    document.body.appendChild(overlay);
  }

  wrap.querySelector('#add').onclick = () => openEditor(null);
  draw(); container.replaceChildren(wrap);
}

// ===== Helper Excel (pakai library global XLSX dari xlsx-js-style) =====
function xlsxReady() {
  if (typeof XLSX === 'undefined') { toast('Library Excel gagal dimuat. Periksa koneksi internet lalu muat ulang halaman.', 'error'); return false; }
  return true;
}
// Set lebar kolom otomatis menyesuaikan isi terpanjang (autofit)
function autoFitCols(ws, aoa) {
  ws['!cols'] = aoa[0].map((_, c) => {
    let max = 8;
    aoa.forEach(r => { const len = (r[c] === null || r[c] === undefined) ? 0 : String(r[c]).length; if (len > max) max = len; });
    return { wch: Math.min(max + 2, 60) };
  });
}
// Beri garis tabel (border) di semua sel + header tebal berwarna
function styleSheetGrid(ws, rowCount, colCount) {
  const border = { style: 'thin', color: { rgb: 'B0B0B0' } };
  for (let R = 0; R < rowCount; R++) {
    for (let C = 0; C < colCount; C++) {
      const addr = XLSX.utils.encode_cell({ r: R, c: C });
      if (!ws[addr]) ws[addr] = { t: 's', v: '' };
      ws[addr].s = {
        border: { top: border, bottom: border, left: border, right: border },
        alignment: { vertical: 'center', wrapText: false },
        ...(R === 0 ? { font: { bold: true, color: { rgb: 'FFFFFF' } }, fill: { fgColor: { rgb: '4F46E5' } } } : {})
      };
    }
  }
}
// Unduh Excel berisi TABEL Excel asli (ada tombol filter/sort di header, baris belang-seling, lebar kolom otomatis).
// opts: { dropdowns: {indexKolom: [pilihan...]}, notes: [[baris petunjuk]...], noteSheet: 'Petunjuk' }
// Jika ExcelJS gagal dimuat, otomatis memakai cara lama (grid + auto-filter) agar unduhan tetap jalan.
function buildAndDownloadXlsx(aoa, sheetName, filename, opts) {
  opts = opts || {};
  if (typeof ExcelJS === 'undefined') return buildAndDownloadXlsxFallback(aoa, sheetName, filename);
  try {
    const headers = aoa[0], body = aoa.slice(1);
    const safeName = String(sheetName).replace(/[\\\/\?\*\[\]:]/g, ' ').slice(0, 31);
    const wb = new ExcelJS.Workbook();
    wb.creator = 'SPMB'; wb.created = new Date();
    const ws = wb.addWorksheet(safeName, { views: [{ state: 'frozen', ySplit: 1 }] });
    // Nama kolom tabel harus unik & tidak kosong
    const seen = {};
    const cols = headers.map((h, i) => {
      let n = String(h === null || h === undefined || h === '' ? 'Kolom ' + (i + 1) : h).trim();
      if (seen[n]) { seen[n]++; n = n + ' (' + seen[n] + ')'; } else seen[n] = 1;
      return { name: n, filterButton: true };
    });
    // Tabel butuh minimal 1 baris data; bila kosong (template) beri 1 baris kosong
    const rows = body.length ? body : [headers.map(() => '')];
    ws.addTable({
      name: 'Tabel_' + safeName.replace(/[^A-Za-z0-9]/g, '') .slice(0, 20) + '1',
      ref: 'A1',
      headerRow: true,
      totalsRow: false,
      style: { theme: 'TableStyleMedium2', showRowStripes: true },
      columns: cols,
      rows: rows
    });
    // Lebar kolom otomatis
    headers.forEach((h, c) => {
      let max = String(h ?? '').length + 4; // ruang tombol filter
      body.forEach(r => { const v = r[c]; const len = (v === null || v === undefined) ? 0 : String(v).split('\n').reduce((m, x) => Math.max(m, x.length), 0); if (len > max) max = len; });
      ws.getColumn(c + 1).width = Math.max(8, Math.min(max + 2, 50));
    });
    // Gaya header & garis tabel
    const border = { style: 'thin', color: { argb: 'FFB0B0B0' } };
    const hr = ws.getRow(1); hr.height = 26;
    for (let r = 1; r <= rows.length + 1; r++) {
      for (let c = 1; c <= headers.length; c++) {
        const cell = ws.getRow(r).getCell(c);
        cell.border = { top: border, bottom: border, left: border, right: border };
        cell.alignment = { vertical: 'middle', wrapText: false, horizontal: r === 1 ? 'center' : 'left' };
        if (r === 1) cell.font = { bold: true, color: { argb: 'FFFFFFFF' } };
      }
    }
    // Dropdown pilihan (mis. Jenis Kelamin, Jurusan) pada kolom yang ditentukan, sampai baris 1000
    Object.keys(opts.dropdowns || {}).forEach(ci => {
      const list = (opts.dropdowns[ci] || []).filter(Boolean);
      const joined = '"' + list.join(',') + '"';
      if (!list.length || joined.length > 255 || list.some(x => String(x).includes(','))) return;
      for (let r = 2; r <= 1000; r++) {
        ws.getRow(r).getCell(Number(ci) + 1).dataValidation = { type: 'list', allowBlank: true, formulae: [joined] };
      }
    });
    // Kolom berformat Teks (agar angka berawalan 0 seperti NISN/No. HP tidak hilang nolnya)
    (opts.textCols || []).forEach(ci => { for (let r = 2; r <= 1000; r++) ws.getRow(r).getCell(Number(ci) + 1).numFmt = '@'; });
    // Sheet petunjuk (di belakang, agar impor tetap membaca sheet pertama)
    if (opts.notes && opts.notes.length) {
      const ns = wb.addWorksheet(opts.noteSheet || 'Petunjuk');
      ns.getColumn(1).width = 110;
      opts.notes.forEach((t, i) => { const row = ns.addRow([t[0] !== undefined ? t[0] : t]); if (i === 0) row.font = { bold: true, size: 14 }; row.alignment = { wrapText: true, vertical: 'top' }; });
    }
    wb.xlsx.writeBuffer().then(buf => {
      const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    }).catch(err => { console.error(err); buildAndDownloadXlsxFallback(aoa, sheetName, filename); });
  } catch (err) { console.error(err); buildAndDownloadXlsxFallback(aoa, sheetName, filename); }
}
function buildAndDownloadXlsxFallback(aoa, sheetName, filename) {
  if (!xlsxReady()) return;
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  autoFitCols(ws, aoa);
  styleSheetGrid(ws, aoa.length, aoa[0].length);
  ws['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: Math.max(aoa.length - 1, 0), c: aoa[0].length - 1 } }) };
  ws['!freeze'] = { xSplit: 0, ySplit: 1 };
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sheetName);
  XLSX.writeFile(wb, filename);
}
// Susunan lengkap data pendaftar: seluruh field formulir + metadata (untuk Download Excel/CSV)
function buildSubmissionRows(subs, schema) {
  schema = schema.filter(f => f.type !== 'heading');
  const headers = ['No', 'No. Pendaftaran', ...schema.map(f => f.label), 'Sumber', 'Status Verifikasi', 'Status Pendaftaran', 'Tahun', 'Tanggal Daftar'];
  const rows = subs.map((s, i) => {
    const vals = schema.map(f => {
      let v = s.data ? s.data[f.id] : '';
      if (f.type === 'checkbox') v = v ? 'Ya' : 'Tidak';
      return (v === undefined || v === null) ? '' : v;
    });
    const sumber = s.source === 'panitia' ? 'Panitia' : s.source === 'import' ? 'Impor Excel' : 'Pendaftar';
    return [i + 1, s.regNo || '', ...vals, sumber, s.verified ? 'Terverifikasi' : 'Belum', s.withdrawn ? 'Cabut Berkas/Keluar' : 'Aktif', s.year || '', s.createdAt ? new Date(s.createdAt).toLocaleString('id-ID') : ''];
  });
  return [headers, ...rows];
}
function buildGuruSiswaRows(items) {
  return [['No', 'Nama', 'Jenis (Guru/Siswa)', 'Keterangan'], ...items.map((it, i) => [i + 1, it.nama || '', it.jenis || '', it.ket || ''])];
}
function buildSmpRows(items) {
  return [['No', 'Nama SMP'], ...items.map((it, i) => [i + 1, it.nama || ''])];
}

// Ubah nilai sel Excel jadi teks isian; kolom tanggal dikonversi ke format YYYY-MM-DD
function excelToFieldValue(v, type) {
  if (v === undefined || v === null) return '';
  if (type === 'date') {
    if (v instanceof Date) return v.toISOString().slice(0, 10);
    if (typeof v === 'number' && v > 0) return new Date(Date.UTC(1899, 11, 30) + Math.round(v) * 86400000).toISOString().slice(0, 10);
    const t = String(v).trim();
    let m = t.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/); // dd/mm/yyyy
    if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
    m = t.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/);
    if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
    return t;
  }
  return String(v).trim();
}

// ===== Fungsi bersama Export/Import/Template pendaftar (dipakai Panel Admin & Panel Panitia) =====

}
function downloadSubmissionsCsv(list, tag) {

  const csv = "data:text/csv;charset=utf-8,\uFEFF" + aoa.map(r => r.map(csvEsc).join(',')).join('\n');

  document.body.appendChild(l); l.click(); document.body.removeChild(l);

function downloadImportTemplate() {
  const fields = DB.getSchema().filter(f => f.type !== 'heading');
  const headers = [...fields.map(f => f.label), 'Tahun (opsional)'];
  const dropdowns = {}, textCols = [];
  fields.forEach((f, i) => {
    if (f.type === 'select' && !f.allowOther) dropdowns[i] = f.options || [];
    else if (f.type === 'checkbox') dropdowns[i] = ['Ya', 'Tidak'];
    else if (f.type === 'bulan') dropdowns[i] = BULAN_ID;
    if (f.type !== 'date') textCols.push(i);
  });
  const required = fields.filter(f => f.required).map(f => f.label);
  const notes = [
    ['PETUNJUK IMPORT PENDAFTAR'],
    ['1. Isi data pada sheet pertama (tabel). Satu baris = satu pendaftar. Jangan mengubah / menghapus judul kolom.'],
    ['2. Kolom wajib diisi: ' + (required.join(', ') || '-') + '. Baris dengan kolom wajib kosong akan dilewati.'],
    ['3. Kolom bertanda pilihan (Jenis Kelamin, Jurusan, dll.) sudah ada dropdown-nya; isi persis sesuai pilihan.'],
    ['4. Tanggal ditulis dengan format TTTT-BB-HH (contoh 2010-05-23) atau HH/BB/TTTT (contoh 23/05/2010).'],
    ['5. Kolom centang (Ya/Tidak): isi "Ya" atau "Tidak".'],
    ['6. "Tahun (opsional)" boleh dikosongkan; bila kosong memakai tahun ajaran aktif (' + DB.getSettings().year + ').'],
    ['7. Nomor pendaftaran dibuat otomatis oleh sistem saat import. File hasil Download Excel juga bisa di-import ulang: baris yang No. Pendaftarannya sudah ada akan dilewati agar tidak dobel.']
  ];
  buildAndDownloadXlsx([headers], 'Template Import', 'Template_Import_Pendaftar.xlsx', { dropdowns, textCols, notes, noteSheet: 'Petunjuk' });
}
// Import file Excel -> tabel spmb_submissions. Mengembalikan true bila ada baris yang masuk.
async function importSubmissionsFromFile(file) {
  if (!xlsxReady()) return false;
  try {
    const schema = DB.getSchema(), subs = DB.getSubmissions();
    const buf = await file.arrayBuffer();
    const wbIn = XLSX.read(buf, { type: 'array' });
    const wsIn = wbIn.Sheets[wbIn.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(wsIn, { defval: '', raw: true });
    if (!rows.length) { toast('File Excel kosong atau formatnya tidak sesuai', 'error'); return false; }
    const settings = DB.getSettings();
    const norm = s => String(s || '').trim().toLowerCase();
    const existingReg = new Set(subs.map(x => norm(x.regNo)));
    const toInsert = []; let skipped = 0, dup = 0; const skippedRows = [];
    const fields = schema.filter(f => f.type !== 'heading');
    rows.forEach((row, idx) => {
      const rowN = {}; Object.keys(row).forEach(k => rowN[norm(k)] = row[k]);
      const reg = norm(rowN['no. pendaftaran']);
      if (reg && existingReg.has(reg)) { dup++; return; }
      const data = {};
      fields.forEach(f => {
        const val = rowN[norm(f.label)];
        if (val === undefined) return;
        if (f.type === 'checkbox') data[f.id] = /^(ya|yes|true|1)$/i.test(String(val).trim());
        else data[f.id] = excelToFieldValue(val, f.type);
      });
      if (!Object.values(data).some(v => v === true || (v !== false && String(v).trim() !== ''))) return; // baris kosong
      if (fields.some(f => f.required && f.type !== 'checkbox' && !data[f.id])) { skipped++; skippedRows.push(idx + 2); return; }
      toInsert.push({ year: String(rowN['tahun (opsional)'] || rowN['tahun'] || settings.year).trim(), data, source: 'import' });
    });
    if (!toInsert.length) {
      toast(dup ? `Semua baris sudah ada (${dup} dilewati karena No. Pendaftaran sama).` : 'Tidak ada baris valid untuk diimpor. Pastikan nama kolom sama dengan label pertanyaan di formulir & data wajib terisi.', 'error');
      return false;
    }
    let inserted;
    try { inserted = await callRpc('spmb_add_submissions', { p_pass: authPass('panitia'), p_rows: toInsert }); }
    catch (error) { rpcFail('Gagal mengimpor ke server', error); return false; }
    const entries = (inserted || []).map(mapSubRow);
    cache.subs.unshift(...entries);
    const extra = [];
    if (skipped) extra.push(`${skipped} baris dilewati karena data wajib kosong (baris Excel: ${skippedRows.slice(0, 8).join(', ')}${skippedRows.length > 8 ? ', ...' : ''})`);
    if (dup) extra.push(`${dup} baris dilewati karena No. Pendaftaran sudah ada`);
    toast(`${entries.length} pendaftar berhasil diimpor${extra.length ? '. ' + extra.join('; ') : ''}`, 'success');
    return true;
  } catch (err) {
    console.error(err); toast('Gagal membaca file Excel. Pastikan formatnya .xlsx/.xls', 'error');
    return false;
  }
}
