    </div>
  `);

  const srcLabel = s => s.source === 'panitia' ? 'Panitia' : s.source === 'import' ? 'Impor Excel' : 'Pendaftar';
  const sortVal = (s, k) => {
    if (k === 'regNo') return String(s.regNo || '');

// ==== Kop dokumen (gambar PNG) untuk semua rekap/cetak ====
// Baca file gambar kop, kecilkan lebar maksimum 1600px, simpan sebagai PNG (transparansi tetap terjaga).
function resizeKopFile(file, maxW = 1600) {
  return new Promise((resolve, reject) => {
    if (!file.type.startsWith('image/')) { reject(new Error('File harus berupa gambar (PNG)')); return; }
    if (file.size > 5 * 1024 * 1024) { reject(new Error('Ukuran file terlalu besar (maks. 5 MB)')); return; }
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Gagal membaca file'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('File bukan gambar yang valid'));
      img.onload = () => {
        let { width, height } = img;
        if (width > maxW) { height = Math.round(height * (maxW / width)); width = maxW; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/png'));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function resizeImageFile(file, maxDim = 320) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Gagal membaca file'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('File bukan gambar yang valid'));
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) { height = Math.round(height * (maxDim / width)); width = maxDim; }
        else if (height > maxDim) { width = Math.round(width * (maxDim / height)); height = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

          </div>
          <div class="flex-1 space-y-2 min-w-0">
            <input type="file" accept="image/*" data-act="file" class="text-xs text-slate-600 dark:text-slate-300 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-indigo-500 file:text-white hover:file:bg-indigo-600 file:cursor-pointer">
            <input type="text" data-act="badge" value="${esc(sl.badge||'')}" placeholder="Label singkat (contoh: Fasilitas)" class="w-full p-2 rounded-lg bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-sm text-slate-900 dark:text-white">
            <input type="text" data-act="title" value="${esc(sl.title||'')}" placeholder="Judul slide" class="w-full p-2 rounded-lg bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-sm font-bold text-slate-900 dark:text-white">
            <textarea data-act="desc" rows="2" placeholder="Deskripsi singkat" class="w-full p-2 rounded-lg bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-sm text-slate-900 dark:text-white">${esc(sl.desc||'')}</textarea>
          </div>
          <div class="flex sm:flex-col gap-2 flex-shrink-0">
            <button type="button" data-act="up" class="px-2 py-1 text-xs font-bold rounded-lg bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300 disabled:opacity-30" ${i===0?'disabled':''}>↑</button>
            <button type="button" data-act="down" class="px-2 py-1 text-xs font-bold rounded-lg bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300 disabled:opacity-30" ${i===slides.length-1?'disabled':''}>↓</button>
            <button type="button" data-act="remove" class="px-2 py-1 text-xs font-bold rounded-lg bg-rose-100 dark:bg-rose-500/20 text-rose-600 dark:text-rose-400">Hapus</button>
          </div>
        </div>
      `);
      card.querySelector('[data-act="file"]').onchange = async e => {
        const file = e.target.files[0];
        if (!file) return;
        try {
          slides[i].image = await resizeImageFile(file, 1280);
          draw();
        } catch (err) { toast(err.message || 'Gagal memuat gambar', 'error'); }
      };
      card.querySelector('[data-act="badge"]').oninput = e => slides[i].badge = e.target.value;
      card.querySelector('[data-act="title"]').oninput = e => slides[i].title = e.target.value;
      card.querySelector('[data-act="desc"]').oninput = e => slides[i].desc = e.target.value;
      card.querySelector('[data-act="up"]').onclick = () => { if (i > 0) { [slides[i-1], slides[i]] = [slides[i], slides[i-1]]; draw(); } };
      card.querySelector('[data-act="down"]').onclick = () => { if (i < slides.length-1) { [slides[i+1], slides[i]] = [slides[i], slides[i+1]]; draw(); } };
      card.querySelector('[data-act="remove"]').onclick = () => { slides.splice(i, 1); draw(); };
      list.appendChild(card);
    });
  }

  wrap.querySelector('#addSlide').onclick = () => {
    slides.push({ image: '', badge: '', title: '', desc: '' });
    draw();
  };

  wrap.querySelector('#saveSlides').onclick = () => {
    if (slides.some(sl => !sl.image)) { toast('Setiap slide harus memiliki foto', 'error'); return; }
    DB.saveSettings({ ...s, slides });
    toast('Slideshow tersimpan', 'success');
  };

  draw();
  container.replaceChildren(wrap);
}

// ===== Rekap Fee Sponsor =====
// Aturan: fee per pendaftar (default Rp100.000, bisa diubah per pendaftar). Sponsor 1 = penuh.
// Hanya guru / hanya siswa = bagi rata. Campuran = porsi guru (%) dibagi rata antar guru, sisanya dibagi rata antar siswa.
function feeDefaults() { return { defaultFee: 100000, pctGuru: 50, pctSiswa: 50, unknownAs: 'Siswa', ttdKepsek: '', ttdBendahara: '', ttdKota: '', overrides: {} }; }
function rp(n) { return 'Rp ' + Math.round(n || 0).toLocaleString('id-ID'); }
function splitEven(total, n) {
  const base = Math.floor(total / n), rem = total - base * n;
  return Array.from({ length: n }, (_, i) => base + (i < rem ? 1 : 0)); // sisa rupiah dibagikan ke yang pertama agar total pas
}
function feeJenisLookup() {
  const m = new Map();
  DB.getGuruSiswaList().forEach(it => {
    const k = String(it.nama || '').trim().toLowerCase();
    if (k && !m.has(k)) m.set(k, { jenis: String(it.jenis || '').toLowerCase().startsWith('sis') ? 'Siswa' : 'Guru', ket: String(it.ket || '').trim() });
  });
  return m;
}
function feeComputeShares(fee, sponsors, cfg) {
  const g = sponsors.filter(x => x.jenis === 'Guru'), s = sponsors.filter(x => x.jenis === 'Siswa');
  let poolG = 0, poolS = 0;
  if (g.length && s.length) { poolG = Math.round(fee * cfg.pctGuru / 100); poolS = fee - poolG; }
  else if (g.length) poolG = fee;
  else if (s.length) poolS = fee;
  const gAmt = g.length ? splitEven(poolG, g.length) : [], sAmt = s.length ? splitEven(poolS, s.length) : [];
  let gi = 0, si = 0;
  return sponsors.map(x => ({ ...x, amount: x.jenis === 'Guru' ? gAmt[gi++] : sAmt[si++] }));
}
function feeCompute(year) {
  const cfg = DB.getFeeConfig(), schema = DB.getSchema();
  const fields = schema.filter(f => f.type === 'cari' && f.source === 'guru_siswa');
  const lookup = feeJenisLookup();
  const subs = DB.getSubmissions()
    .filter(s => !s.withdrawn && (year === 'ALL' || s.year === year))
    .slice().sort((a, b) => String(a.createdAt || '').localeCompare(String(b.createdAt || '')));
  const rows = subs.map(s => {
    const fee = (s.id in cfg.overrides) ? cfg.overrides[s.id] : cfg.defaultFee;
    const seen = new Set(), sponsors = [];
    fields.forEach(f => splitMulti(s.data ? s.data[f.id] : '').forEach(nama => {
      const k = nama.toLowerCase();
      if (seen.has(k)) return; seen.add(k);
      const info = lookup.get(k);
      sponsors.push({ nama, jenis: info ? info.jenis : cfg.unknownAs, registered: !!info, ket: info ? info.ket : '' });
    }));
    return { s, fee, custom: (s.id in cfg.overrides), shares: feeComputeShares(fee, sponsors, cfg) };
  });
  const map = new Map();
  rows.forEach(r => r.shares.forEach(sh => {
    const k = sh.nama.toLowerCase();
    if (!map.has(k)) map.set(k, { nama: sh.nama, jenis: sh.jenis, registered: sh.registered, ket: sh.ket || '', total: 0, items: [] });
    const e = map.get(k); e.total += sh.amount; e.items.push({ s: r.s, amount: sh.amount, n: r.shares.length });
  }));
  const sponsors = Array.from(map.values()).sort((a, b) => b.total - a.total || a.nama.localeCompare(b.nama));
  const totalFee = rows.reduce((a, r) => a + r.fee, 0);
  const noSponsor = rows.filter(r => !r.shares.length);
  return { cfg, fields, rows, sponsors, totalFee, noSponsor,
    noSponsorFee: noSponsor.reduce((a, r) => a + r.fee, 0),
    distributed: sponsors.reduce((a, x) => a + x.total, 0) };
}
function feeSponsorRows(c) {
  const rows = c.sponsors.map((x, i) => [i + 1, x.nama, x.jenis + (x.registered ? '' : ' (belum di Data Guru/Siswa)'), x.items.length, x.total,
    x.items.map(it => `${it.s.regNo} ${it.s.data.nama || '-'}: ${it.amount}`).join('; ')]);
  rows.push(['', 'TOTAL', '', c.sponsors.reduce((a, x) => a + x.items.length, 0), c.distributed, '']);
  return [['No', 'Nama Sponsor', 'Jenis', 'Jumlah Pendaftar', 'Total Fee (Rp)', 'Rincian Pendaftar'], ...rows];
}
function feeDetailRows(c) {
  const rows = c.rows.map((r, i) => [i + 1, r.s.regNo || '', r.s.data.nama || '', r.s.year || '', r.fee,
    r.shares.map(x => x.nama + ' (' + x.jenis + ')').join('; ') || 'Tanpa sponsor',
    r.shares.map(x => `${x.nama}: ${x.amount}`).join('; ')]);
  rows.push(['', '', '', 'TOTAL', c.totalFee, '', '']);
  return [['No', 'No. Pendaftaran', 'Nama Pendaftar', 'Tahun Ajaran', 'Fee (Rp)', 'Sponsor', 'Pembagian (Rp)'], ...rows];
}

    } else {
      body.innerHTML = `<div class="space-y-3"><input id="feeQ" type="text" value="${esc(q)}" placeholder="Cari nama / no. pendaftaran..." class="${inp} sm:!w-64">
        <div class="overflow-x-auto rounded-2xl border border-slate-200 dark:border-slate-800"><table class="w-full text-left text-sm">
        <thead class="bg-slate-100 dark:bg-slate-900 text-slate-600 dark:text-slate-400 font-bold uppercase text-xs"><tr><th class="p-3">No. Daftar</th><th class="p-3">Nama</th><th class="p-3">Fee (Rp)</th><th class="p-3">Sponsor &amp; Pembagian</th></tr></thead>
        <tbody id="feeRows" class="divide-y divide-slate-200 dark:divide-slate-800 text-slate-700 dark:text-slate-200"></tbody></table></div></div>`;
      const drawRows = () => {
        const t = q.toLowerCase();
        $('#feeRows').innerHTML = c.rows.filter(r => !t || String(r.s.regNo).toLowerCase().includes(t) || String(r.s.data.nama || '').toLowerCase().includes(t)).map(r => `
          <tr class="align-top"><td class="p-3 font-mono font-bold text-sky-600 dark:text-sky-400">${esc(r.s.regNo)}</td><td class="p-3 font-bold">${esc(r.s.data.nama || '-')}</td>
          <td class="p-3"><input type="number" min="0" step="1000" data-fee="${r.s.id}" value="${r.fee}" title="Kosongkan untuk kembali ke fee default" class="feeIn w-32 p-1.5 rounded-lg border ${r.custom ? 'border-amber-400 bg-amber-50 dark:bg-amber-500/10' : 'border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-900'} text-sm text-slate-900 dark:text-white"></td>
          <td class="p-3 text-xs">${r.shares.length ? r.shares.map(x => `<div>${esc(x.nama)} ${badge(x.jenis)} — <b>${rp(x.amount)}</b></div>`).join('') : '<span class="text-slate-400">Tanpa sponsor</span>'}</td></tr>`).join('');
      };
      drawRows();
      $('#feeQ').oninput = e => { q = e.target.value; drawRows(); };
      $('#feeRows').onchange = e => {
        const i = e.target.closest('.feeIn'); if (!i) return;
        const cur = DB.getFeeConfig(), ov = { ...cur.overrides }, v = i.value.trim(), n = Math.round(Number(v));
        if (v !== '' && !(n >= 0)) { toast('Nilai fee tidak valid', 'error'); return; }
        if (v === '' || n === cur.defaultFee) delete ov[i.dataset.fee]; else ov[i.dataset.fee] = n;
        DB.saveFeeConfig({ ...cur, overrides: ov }); draw();
      };
    }
  }
  draw();
  container.replaceChildren(wrap);
}

function renderSettings(container) {
  const s = DB.getSettings();
  const feeCfg = DB.getFeeConfig();
  let pendingLogo = s.logo || '';
  let pendingKop = DB.getKop();

  const form = el(`
    <form class="space-y-5 max-w-lg">
      <div>
        <label class="text-xs font-bold text-slate-500 block mb-1">Nama Instansi</label>
        <input type="text" id="sn" value="${esc(s.schoolName)}" class="w-full p-2 rounded-lg bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white">
      </div>
      <div>
        <label class="text-xs font-bold text-slate-500 block mb-1">Tahun Ajaran Aktif</label>
        <input type="text" id="sy" value="${esc(s.year)}" placeholder="Contoh: 2026/2027" class="w-full p-2 rounded-lg bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white">
        <p class="text-xs text-slate-400 mt-1">Menentukan tahun ajaran yang tercatat pada setiap pendaftaran baru.</p>
      </div>
      <div>
        <label class="text-xs font-bold text-slate-500 block mb-1">Judul Halaman Pendaftaran</label>
        <input type="text" id="sft" value="${esc(s.formTitle)}" placeholder="Contoh: Formulir Pendaftaran" class="w-full p-2 rounded-lg bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white">
      </div>
      <div class="space-y-3 p-4 rounded-2xl border border-slate-200 dark:border-slate-800">
        <p class="text-sm font-bold text-slate-900 dark:text-white">Penandatangan Daftar Penerimaan Fee</p>
        <div>
          <label class="text-xs font-bold text-slate-500 block mb-1">Nama Kepala Sekolah</label>
          <input type="text" id="sks" value="${esc(feeCfg.ttdKepsek)}" placeholder="Nama lengkap beserta gelar" class="w-full p-2 rounded-lg bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white">
        </div>
        <div>
          <label class="text-xs font-bold text-slate-500 block mb-1">Nama Bendahara Sekolah</label>
          <input type="text" id="sbd" value="${esc(feeCfg.ttdBendahara)}" placeholder="Nama lengkap beserta gelar" class="w-full p-2 rounded-lg bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white">
        </div>
        <div>
          <label class="text-xs font-bold text-slate-500 block mb-1">Kota (untuk tanggal tanda tangan)</label>
          <input type="text" id="skota" value="${esc(feeCfg.ttdKota)}" placeholder="Contoh: Cilacap" class="w-full p-2 rounded-lg bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white">
        </div>
      </div>
      <div>
        <label class="text-xs font-bold text-slate-500 block mb-1">Logo / Foto Sekolah</label>
        <div class="flex items-center gap-4">
          <div id="logoPreviewBox" class="w-16 h-16 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 flex items-center justify-center overflow-hidden flex-shrink-0">
            ${pendingLogo ? `<img id="logoPreview" src="${pendingLogo}" class="w-full h-full object-cover">` : `<span id="logoPreview" class="text-xs text-slate-400">Tidak ada</span>`}
          </div>
          <div class="space-y-2">
            <input type="file" id="sl" accept="image/*" class="text-xs text-slate-600 dark:text-slate-300 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-indigo-500 file:text-white hover:file:bg-indigo-600 file:cursor-pointer">
            <button type="button" id="slRemove" class="block text-xs text-rose-500 font-bold ${pendingLogo ? '' : 'hidden'}">Hapus Foto</button>
          </div>
        </div>
      </div>
      <div class="space-y-3 p-4 rounded-2xl border border-slate-200 dark:border-slate-800">
        <div>
          <p class="text-sm font-bold text-slate-900 dark:text-white">Kop Dokumen (PNG)</p>
          <p class="text-xs text-slate-400 mt-1">Gambar kop ini tampil di bagian atas semua rekap yang dicetak. Disarankan PNG lebar (mis. 2000 × 300 px, kop sudah memuat logo, nama, alamat, dan garis). Jika kosong, dipakai kop teks + logo.</p>
        </div>
        <div id="kopPreviewBox" class="w-full rounded-xl bg-white border border-slate-300 dark:border-slate-700 flex items-center justify-center overflow-hidden min-h-[64px]">
          ${pendingKop ? `<img src="${pendingKop}" class="w-full h-auto">` : `<span class="text-xs text-slate-400 py-4">Belum ada kop</span>`}
        </div>
        <input type="file" id="skop" accept="image/png,image/*" class="text-xs text-slate-600 dark:text-slate-300 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-indigo-500 file:text-white hover:file:bg-indigo-600 file:cursor-pointer">
        <button type="button" id="skopRemove" class="block text-xs text-rose-500 font-bold ${pendingKop ? '' : 'hidden'}">Hapus Kop</button>
      </div>
      <button type="submit" class="px-4 py-2 bg-indigo-500 text-white font-bold rounded-xl text-sm">Simpan</button>
    </form>
  `);

  form.querySelector('#sl').onchange = async e => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      pendingLogo = await resizeImageFile(file);
      const box = form.querySelector('#logoPreviewBox');
      box.innerHTML = `<img id="logoPreview" src="${pendingLogo}" class="w-full h-full object-cover">`;
      form.querySelector('#slRemove').classList.remove('hidden');
    } catch (err) { toast(err.message || 'Gagal memuat gambar', 'error'); }
  };
  form.querySelector('#slRemove').onclick = () => {
    pendingLogo = '';
    form.querySelector('#logoPreviewBox').innerHTML = `<span id="logoPreview" class="text-xs text-slate-400">Tidak ada</span>`;
    form.querySelector('#sl').value = '';
    form.querySelector('#slRemove').classList.add('hidden');
  };

  form.querySelector('#skop').onchange = async e => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      pendingKop = await resizeKopFile(file);
      form.querySelector('#kopPreviewBox').innerHTML = `<img src="${pendingKop}" class="w-full h-auto">`;
      form.querySelector('#skopRemove').classList.remove('hidden');
    } catch (err) { toast(err.message || 'Gagal memuat gambar', 'error'); e.target.value = ''; }
  };
  form.querySelector('#skopRemove').onclick = () => {
    pendingKop = '';
    form.querySelector('#kopPreviewBox').innerHTML = `<span class="text-xs text-slate-400 py-4">Belum ada kop</span>`;
    form.querySelector('#skop').value = '';
    form.querySelector('#skopRemove').classList.add('hidden');
  };

  form.onsubmit = e => {
    e.preventDefault();
    if (pendingKop !== DB.getKop()) DB.saveKop(pendingKop);
    DB.saveSettings({
      ...s,
      schoolName: form.querySelector('#sn').value,
      year: form.querySelector('#sy').value,
      formTitle: form.querySelector('#sft').value,
      logo: pendingLogo
    });
    DB.saveFeeConfig({ ...DB.getFeeConfig(),
      ttdKepsek: form.querySelector('#sks').value.trim(),
      ttdBendahara: form.querySelector('#sbd').value.trim(),
      ttdKota: form.querySelector('#skota').value.trim() });
    updateHeader();
    toast('Pengaturan tersimpan', 'success');
  };
  const linkCard = el(`
    <div class="max-w-sm mb-8 p-4 rounded-2xl bg-sky-50 dark:bg-sky-500/10 border border-sky-200 dark:border-sky-500/20 space-y-3">
      <div>
        <p class="text-sm font-bold text-slate-900 dark:text-white">Link Khusus Siswa Pendaftar</p>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Bagikan link ini ke calon siswa. Yang tampil hanya formulir pendaftaran, tanpa menu Portal Panitia, Panel Admin, dan Pengaturan.</p>
      </div>
      <input type="text" id="stuLink" readonly value="${esc(buildStudentLink())}" class="w-full p-2 rounded-lg bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-xs text-slate-900 dark:text-white">
      <div class="flex gap-2">
        <button type="button" id="stuCopy" class="px-3 py-1.5 bg-sky-500 hover:bg-sky-600 text-white font-bold rounded-lg text-xs">Salin Link</button>
        <a id="stuOpen" href="${esc(buildStudentLink())}" target="_blank" rel="noopener" class="px-3 py-1.5 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-slate-700 dark:text-slate-200 font-bold rounded-lg text-xs">Buka Pratinjau</a>
      </div>
    </div>
  `);
  linkCard.querySelector('#stuCopy').onclick = async () => {
    const inp = linkCard.querySelector('#stuLink');
    try { await navigator.clipboard.writeText(inp.value); }
    catch (e) { inp.select(); document.execCommand('copy'); }
    toast('Link siswa disalin', 'success');
  };
  const pwCard = el(`
    <form class="max-w-sm mt-8 p-4 rounded-2xl bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-800 space-y-3">
      <div>
        <p class="text-sm font-bold text-slate-900 dark:text-white">Ubah Kata Sandi</p>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Kata sandi disimpan terenkripsi (hash) di database, bukan di HTML.</p>
      </div>
      <select id="pwRole" class="w-full p-2 rounded-lg bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-sm text-slate-900 dark:text-white">
        <option value="panitia">Kata sandi Panitia</option>
        <option value="admin">Kata sandi Admin</option>
      </select>
      <input type="password" id="pwCur" required autocomplete="current-password" placeholder="Kata sandi Admin saat ini" class="w-full p-2 rounded-lg bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-sm text-slate-900 dark:text-white">
      <input type="password" id="pwNew" required minlength="6" autocomplete="new-password" placeholder="Kata sandi baru (min. 6 karakter)" class="w-full p-2 rounded-lg bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-sm text-slate-900 dark:text-white">
      <input type="password" id="pwNew2" required minlength="6" autocomplete="new-password" placeholder="Ulangi kata sandi baru" class="w-full p-2 rounded-lg bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-sm text-slate-900 dark:text-white">
      <button type="submit" class="px-4 py-2 bg-indigo-500 hover:bg-indigo-600 text-white font-bold rounded-lg text-sm">Simpan Kata Sandi</button>
    </form>
  `);
  pwCard.onsubmit = async e => {
    e.preventDefault();
    const cur = pwCard.querySelector('#pwCur').value, nw = pwCard.querySelector('#pwNew').value, nw2 = pwCard.querySelector('#pwNew2').value;
    const role = pwCard.querySelector('#pwRole').value;
    if (nw !== nw2) { toast('Pengulangan kata sandi baru tidak sama', 'error'); return; }
    const { data, error } = await supabaseClient.rpc('spmb_set_password', { p_admin_pass: cur, p_role: role, p_new: nw });
    if (error) { console.error(error); toast(error.message || 'Gagal menyimpan kata sandi', 'error'); return; }
    if (data !== true) { toast('Kata sandi Admin saat ini salah', 'error'); return; }
    if (role === 'admin') sessionStorage.setItem('spmb_admin_pw', nw);
    pwCard.reset();
    toast('Kata sandi ' + (role === 'admin' ? 'Admin' : 'Panitia') + ' diperbarui', 'success');
  };
  const resetCard = el(`
    <form class="max-w-sm mt-8 p-4 rounded-2xl bg-rose-50 dark:bg-rose-500/10 border border-rose-200 dark:border-rose-500/30 space-y-3">
      <div>
        <p class="text-sm font-bold text-rose-700 dark:text-rose-300">Reset Nomor Pendaftaran</p>
        <p class="text-xs text-slate-600 dark:text-slate-400 mt-1">Mengatur ulang hitungan nomor pendaftaran, misalnya setelah uji coba. Jika data dihapus, nomor berikutnya kembali ke 1. Jika data tidak dihapus, nomor berikutnya melanjutkan angka tertinggi yang ada.</p>
      </div>
      <label class="flex items-start gap-2 text-sm text-slate-700 dark:text-slate-200"><input type="checkbox" id="rsDel" checked class="rounded mt-0.5"> <span>Hapus <b>semua</b> data pendaftar (tidak bisa dibatalkan)</span></label>
      <input type="text" id="rsConf" autocomplete="off" placeholder="Ketik RESET untuk konfirmasi" class="w-full p-2 rounded-lg bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-sm text-slate-900 dark:text-white">
      <button type="submit" class="px-4 py-2 bg-rose-500 hover:bg-rose-600 text-white font-bold rounded-lg text-sm">Reset Nomor</button>
    </form>
  `);
  resetCard.onsubmit = async e => {
    e.preventDefault();
    if (resetCard.querySelector('#rsConf').value.trim() !== 'RESET') { toast('Ketik RESET (huruf besar) untuk konfirmasi', 'error'); return; }
    const hapus = resetCard.querySelector('#rsDel').checked;
    if (!confirm(hapus ? 'Semua data pendaftar akan DIHAPUS permanen dan nomor kembali ke 1. Lanjutkan?' : 'Atur ulang hitungan nomor pendaftaran?')) return;
    try {
      const r = await callRpc('spmb_reset_regno', { p_pass: authPass('admin'), p_hapus: hapus });
      await loadPrivate();
      resetCard.reset();
      toast('Nomor direset. Nomor berikutnya: ' + (r && r.nomor_berikutnya != null ? r.nomor_berikutnya : '1') + (hapus ? ` (${(r && r.dihapus) || 0} data dihapus)` : ''), 'success');
    } catch (err) {
      if (/spmb_reset_regno/.test(err.message || '') && /find|exist|schema cache/i.test(err.message || '')) toast('Fungsi reset belum ada di Supabase. Jalankan setup_reset_nomor.sql dulu.', 'error');
      else rpcFail(err.message || 'Gagal mereset nomor pendaftaran', err);
    }
  };
  container.replaceChildren(linkCard, form, pwCard, resetCard);
}

function renderLogin(role) {
  const isA = role === 'admin';
  const wrap = el(`
    <div class="max-w-sm mx-auto mt-12 glass-panel p-8 rounded-3xl text-center space-y-6">
      <h3 class="font-display font-bold text-2xl text-slate-900 dark:text-white">Login ${isA?'Admin':'Panitia'}</h3>
      <form id="lF" class="space-y-4">
        <input type="password" id="pw" required placeholder="Kata Sandi" class="w-full p-3 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white text-center">
        <button type="submit" class="w-full p-3 bg-${isA?'indigo':'amber'}-500 text-white font-bold rounded-xl">Masuk</button>
      </form>
      <button id="bck" class="text-xs text-slate-500 font-bold">← Batal</button>
    </div>
  `);
  wrap.querySelector('#bck').onclick = () => { currentRole='siswa'; renderApp(); };
  wrap.querySelector('#lF').onsubmit = async e => {
    e.preventDefault();
    const btn = wrap.querySelector('button[type=submit]'), pw = wrap.querySelector('#pw').value;
    btn.disabled = true; btn.textContent = 'Memeriksa...';
    // Kata sandi diverifikasi di database (fungsi spmb_login); tidak ada kata sandi di HTML maupun di data yang diunduh browser.
    const { data, error } = await supabaseClient.rpc('spmb_login', { p_role: role, p_pass: pw });
    btn.disabled = false; btn.textContent = 'Masuk';
    if (error) { console.error(error); toast('Gagal menghubungi server. Pastikan setup_auth.sql sudah dijalankan.', 'error'); return; }
    if (data === true) {
      sessionStorage.setItem(`spmb_${role}_auth`, '1');
      sessionStorage.setItem(`spmb_${role}_pw`, pw); // hanya untuk sesi tab ini
      btn.disabled = true; btn.textContent = 'Memuat data...';
      try { await loadPrivate(); }
      catch (err) { console.error(err); logoutSession(role); btn.disabled = false; btn.textContent = 'Masuk'; toast('Gagal memuat data dari server. Pastikan setup_keamanan.sql sudah dijalankan.', 'error'); return; }
      renderApp();
    } else toast('Sandi salah!', 'error');
  };
  document.getElementById('app').replaceChildren(wrap);
}

let currentRole = 'siswa';

function updateHeader() {
  const s = DB.getSettings();
  document.getElementById('schoolName').textContent = s.schoolName;
  document.getElementById('yearTag').textContent = 'SPMB ' + s.year;
  document.getElementById('footerYear').textContent = new Date().getFullYear();
  const rl = document.getElementById('roleLabel'); if (rl) rl.textContent = currentRole === 'siswa' ? 'Portal Siswa' : currentRole === 'panitia' ? 'Panel Panitia' : 'Panel Admin';

  const logoSrc = window.SCHOOL_LOGO_B64 || s.logo;
  const logoImg = document.getElementById('customLogoImg'), defaultIcon = document.getElementById('defaultLogoIcon');
  if (logoSrc) { logoImg.src = logoSrc; logoImg.classList.remove('hidden'); defaultIcon.classList.add('hidden'); }
  else { logoImg.classList.add('hidden'); logoImg.removeAttribute('src'); defaultIcon.classList.remove('hidden'); }
}

function renderApp() {
  if (STUDENT_ONLY) currentRole = 'siswa'; // kunci: tidak bisa pindah ke panitia/admin
  updateHeader();
  // Panel panitia/admin memakai lebar layar penuh (tabel tidak perlu digeser); form siswa tetap rapi di tengah
  { const wide = currentRole !== 'siswa';
    [document.getElementById('app'), document.getElementById('hdrInner')].forEach(n => { if (!n) return; n.classList.toggle('max-w-7xl', !wide); n.classList.toggle('max-w-none', wide); });
    const ap = document.getElementById('app'); if (ap) { ap.classList.toggle('lg:px-8', !wide); ap.classList.toggle('lg:px-6', wide); } }
  if (currentRole === 'siswa') viewSiswa();
  else if (currentRole === 'panitia') viewPanitia();
  else viewAdmin();
}

document.getElementById('themeToggleBtn')?.addEventListener('click', toggleTheme);
document.getElementById('brandHomeBtn').addEventListener('click', () => { currentRole = 'siswa'; renderApp(); });

if (STUDENT_ONLY) {
  document.getElementById('roleSwitcher')?.remove(); // hapus menu Portal Siswa/Panitia/Admin dari DOM
} else {
  const setBtn = document.getElementById('settingsBtn'), setMenu = document.getElementById('settingsMenu');
  setBtn.addEventListener('click', e => { e.stopPropagation(); setMenu.classList.toggle('hidden'); });
  document.querySelectorAll('.role-opt').forEach(b => b.addEventListener('click', () => { currentRole = b.dataset.role; setMenu.classList.add('hidden'); renderApp(); }));
  document.addEventListener('click', () => setMenu.classList.add('hidden'));
}

initTheme();
document.getElementById('app').innerHTML = '<div class="text-center py-20 text-slate-400 dark:text-slate-500">Memuat data dari server...</div>';
loadFromSupabase()
  .then(() => loadPrivate().catch(err => { console.error(err); ['admin','panitia'].forEach(logoutSession); }))
  .then(renderApp)
  .catch((err) => {
    console.error('Init error:', err);
    document.getElementById('app').innerHTML = '<div class="text-center py-20 text-rose-500 font-bold">Gagal terhubung ke Supabase.<br><span class="font-normal text-sm text-slate-500">Periksa URL/API key dan pastikan tabel spmb_settings, spmb_schema, spmb_submissions sudah dibuat.</span></div>';
  });
</script>
</body>
