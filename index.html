<script>
const LS_KEY = { theme: 'ppdb_theme' };

// ==== Supabase connection ====
const SUPABASE_URL = 'https://xrvkhamqarbtxismmxrs.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_LRFBHokFnNO4SDSpqqywuw_oKyCwOao';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function initTheme() {
  const savedTheme = localStorage.getItem(LS_KEY.theme) || 'dark';
  setTheme(savedTheme);
}

function setTheme(theme) {
  const html = document.documentElement;
  const sunIcon = document.getElementById('sunIcon');
  const moonIcon = document.getElementById('moonIcon');

  if (theme === 'light') {
    html.classList.remove('dark');
    html.classList.add('light');
    localStorage.setItem(LS_KEY.theme, 'light');
    if (sunIcon) sunIcon.classList.add('hidden');
    if (moonIcon) moonIcon.classList.remove('hidden');
  } else {
    html.classList.remove('light');
    html.classList.add('dark');
    localStorage.setItem(LS_KEY.theme, 'dark');
    if (sunIcon) sunIcon.classList.remove('hidden');
    if (moonIcon) moonIcon.classList.add('hidden');
  }
}

function toggleTheme() {
  const current = localStorage.getItem(LS_KEY.theme) || 'dark';
  setTheme(current === 'dark' ? 'light' : 'dark');
}

// Local cache kept in sync with Supabase. Reads (getX) are synchronous and
// hit this cache; writes (saveX/addX/updateX) push to Supabase and patch the
// cache immediately so the UI stays responsive.
const cache = { settings: null, schema: null, subs: [] };

function mapSettingsRow(r) {
  return {
    schoolName: r?.school_name ?? 'SMA Harapan Bangsa',
    year: r?.year ?? String(new Date().getFullYear()),
    formTitle: r?.form_title ?? 'Formulir Pendaftaran',
    logo: r?.logo ?? '',
    adminPass: r?.admin_pass ?? 'admin123',
    panitiaPass: r?.panitia_pass ?? 'panitia123',
    slides: (r?.slides && Array.isArray(r.slides) && r.slides.length) ? r.slides : defaultSlides()
  };
}
function defaultSlides() {
  return [
    { badge: 'Gedung & Fasilitas', title: 'Kampus Modern & Asri', desc: 'Dilengkapi ruang kelas ber-AC, perpus digital, sarana olahraga.', image: 'https://images.unsplash.com/photo-1523050854058-8df90110c9f1?auto=format&fit=crop&w=1200&q=80' },
    { badge: 'Teknologi Terkini', title: 'Praktikum Sains & IT', desc: 'Mendukung pembelajaran praktis interaktif berbasis teknologi.', image: 'https://images.unsplash.com/photo-1562774053-701939374585?auto=format&fit=crop&w=1200&q=80' }
  ];
}
function mapSubRow(r) {
  return { id: r.id, regNo: r.reg_no, data: r.data || {}, source: r.source || 'siswa', verified: !!r.verified, year: r.year, createdAt: r.created_at };
}

const DB = {
  getSettings: () => cache.settings || mapSettingsRow(null),
  saveSettings: function(s) {
    cache.settings = { ...cache.settings, ...s };
    supabaseClient.from('ppdb_settings').update({
      school_name: s.schoolName, year: s.year, form_title: s.formTitle,
      logo: s.logo, admin_pass: s.adminPass, panitia_pass: s.panitiaPass, slides: s.slides
    }).eq('id', 1).then(({error}) => { if(error){ console.error(error); toast('Gagal menyimpan pengaturan ke server', 'error'); } });
  },
  getSchema: () => cache.schema && cache.schema.length ? cache.schema : defaultSchema(),
  saveSchema: function(f) {
    cache.schema = f;
    supabaseClient.from('ppdb_schema').update({ fields: f }).eq('id', 1)
      .then(({error}) => { if(error){ console.error(error); toast('Gagal menyimpan formulir ke server', 'error'); } });
  },
  getSubmissions: () => cache.subs,
  addSubmission: async function(data, source) {
    const settings = this.getSettings();
    const { data: row, error } = await supabaseClient.from('ppdb_submissions')
      .insert({ year: settings.year, data, source: source || 'siswa' })
      .select().single();
    if (error) { console.error(error); toast('Gagal mengirim pendaftaran ke server', 'error'); throw error; }
    const entry = mapSubRow(row);
    cache.subs.unshift(entry);
    return entry;
  },
  updateSubmission: function(id, patch) {
    const i = cache.subs.findIndex(x => x.id === id);
    if (i > -1) cache.subs[i] = { ...cache.subs[i], ...patch };
    const dbPatch = {};
    if ('data' in patch) dbPatch.data = patch.data;
    if ('verified' in patch) dbPatch.verified = patch.verified;
    supabaseClient.from('ppdb_submissions').update(dbPatch).eq('id', id)
      .then(({error}) => { if(error){ console.error(error); toast('Gagal menyimpan perubahan ke server', 'error'); } });
    return cache.subs[i];
  },
  getYears: function() {
    const years = new Set(this.getSubmissions().map(s => s.year).filter(Boolean));
    years.add(this.getSettings().year);
    return Array.from(years).sort().reverse();
  }
};

async function loadFromSupabase() {
  const [setRes, schemaRes, subsRes] = await Promise.all([
    supabaseClient.from('ppdb_settings').select('*').eq('id', 1).single(),
    supabaseClient.from('ppdb_schema').select('*').eq('id', 1).single(),
    supabaseClient.from('ppdb_submissions').select('*').order('created_at', { ascending: false })
  ]);
  if (setRes.error || schemaRes.error || subsRes.error) {
    console.error(setRes.error || schemaRes.error || subsRes.error);
    throw new Error('supabase_load_failed');
  }
  cache.settings = mapSettingsRow(setRes.data);
  cache.subs = (subsRes.data || []).map(mapSubRow);
  if (schemaRes.data && schemaRes.data.fields && schemaRes.data.fields.length) {
    cache.schema = schemaRes.data.fields;
  } else {
    cache.schema = defaultSchema();
    DB.saveSchema(cache.schema);
  }
}

function defaultSchema() {
  return [
    { id: 'nama', label: 'Nama Lengkap', type: 'text', required: true, visibility: 'all' },
    { id: 'nisn', label: 'NISN', type: 'text', required: true, visibility: 'all' },
    { id: 'ttl_tempat', label: 'Tempat Lahir', type: 'text', required: true, visibility: 'all' },
    { id: 'ttl_tanggal', label: 'Tanggal Lahir', type: 'date', required: true, visibility: 'all' },
    { id: 'gender', label: 'Jenis Kelamin', type: 'select', required: true, options: ['Laki-laki', 'Perempuan'], visibility: 'all' },
    { id: 'alamat', label: 'Alamat Lengkap', type: 'textarea', required: true, visibility: 'all' },
    { id: 'hp_ortu', label: 'No. HP Orang Tua/Wali', type: 'text', required: true, visibility: 'all' },
    { id: 'asal_sekolah', label: 'Asal Sekolah', type: 'text', required: true, visibility: 'all' },
    { id: 'jurusan', label: 'Pilihan Jurusan', type: 'select', required: true, options: ['IPA', 'IPS', 'Bahasa', 'Peminatan Khusus'], visibility: 'all' },
    { id: 'ukuran_seragam', label: 'Ukuran Seragam', type: 'select', required: false, options: ['S', 'M', 'L', 'XL', 'XXL'], visibility: 'panitia' },
    { id: 'terima_seragam', label: 'Terima Seragam', type: 'checkbox', required: false, visibility: 'panitia' }
  ];
}

// Field yang visibility-nya belum diset (data lama) dianggap 'all' (tampil utk pendaftar & panitia)
function fieldVisibility(f) { return f.visibility === 'panitia' ? 'panitia' : 'all'; }
// Field publik: field yang boleh tampil di formulir pendaftar (siswa)
function publicSchema(schema) { return schema.filter(f => fieldVisibility(f) !== 'panitia'); }

function el(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstChild; }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function toast(msg, type = 'info') {
  document.querySelectorAll('.toast-item').forEach(e => e.remove());
  const icon = type === 'success' ? '✓' : type === 'error' ? '✕' : 'ℹ';
  const t = el(`
    <div class="toast-item fixed bottom-6 right-6 z-50 flex items-center gap-3 px-5 py-3.5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 shadow-2xl transition-all duration-300 transform translate-y-0 opacity-100">
      <span class="w-7 h-7 rounded-full ${type==='error'?'bg-rose-100 dark:bg-rose-500/20 text-rose-600 dark:text-rose-400':type==='success'?'bg-emerald-100 dark:bg-emerald-500/20 text-emerald-600 dark:text-emerald-400':'bg-sky-100 dark:bg-sky-500/20 text-sky-600 dark:text-sky-400'} flex items-center justify-center font-bold text-xs">${icon}</span>
      <span class="text-sm font-medium text-slate-800 dark:text-slate-100">${msg}</span>
    </div>
  `);
  document.body.appendChild(t);
  setTimeout(() => { t.classList.add('opacity-0', 'translate-y-2'); setTimeout(() => t.remove(), 300); }, 2800);
}

function copyToClipboard(text) {
  const input = document.createElement('textarea');
  input.value = text; document.body.appendChild(input); input.select();
  try { document.execCommand('copy'); toast('Nomor berhasil disalin!', 'success'); } 
  catch (err) { toast('Gagal menyalin', 'error'); }
  document.body.removeChild(input);
}

function renderFieldInput(f, value = '') {
  const req = f.required ? '<span class="text-rose-500 font-bold ml-1">*</span>' : '';
  const cmn = "w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-900/90 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500/50 focus:border-sky-500 transition-all text-sm";
  let input = '';
  
  if (f.type === 'checkbox') {
    const checked = (value === true || value === 'true') ? 'checked' : '';
    return `<div class="space-y-1.5"><label class="flex items-center gap-3 p-3 rounded-xl bg-slate-50 dark:bg-slate-900/90 border border-slate-300 dark:border-slate-700 cursor-pointer select-none">
      <input type="checkbox" name="${f.id}" ${checked} class="w-5 h-5 rounded accent-amber-500 flex-shrink-0">
      <span class="text-sm font-semibold text-slate-700 dark:text-slate-300">${esc(f.label)} ${req}</span>
    </label></div>`;
  } else if (f.type === 'textarea') {
    input = `<textarea name="${f.id}" class="${cmn} min-h-[100px] resize-y" placeholder="Masukkan ${esc(f.label).toLowerCase()}..." ${f.required ? 'required' : ''}>${esc(value)}</textarea>`;
  } else if (f.type === 'select') {
    const opts = f.options || [];
    const isOther = f.allowOther && value && !opts.includes(value);
    const selVal = isOther ? '__OTHER__' : value;
    input = `
      <div class="space-y-2">
        <select name="${f.id}" class="selWithOther ${cmn}" ${f.required ? 'required' : ''}>
          <option value="">Pilih ${esc(f.label)}...</option>
          ${opts.map(o => `<option value="${esc(o)}" ${o === selVal ? 'selected' : ''}>${esc(o)}</option>`).join('')}
          ${f.allowOther ? `<option value="__OTHER__" ${selVal === '__OTHER__' ? 'selected' : ''}>Lainnya...</option>` : ''}
        </select>
        ${f.allowOther ? `<input type="text" name="${f.id}__other" class="otherInput ${selVal === '__OTHER__' ? '' : 'hidden'} ${cmn} mt-2" placeholder="Sebutkan..." value="${isOther ? esc(value) : ''}" ${(f.required && selVal === '__OTHER__') ? 'required' : ''}>` : ''}
      </div>`;
  } else {
    input = `<input type="${f.type}" name="${f.id}" value="${esc(value)}" class="${cmn}" placeholder="Masukkan ${esc(f.label).toLowerCase()}..." ${f.required ? 'required' : ''}>`;
  }

  return `<div class="space-y-1.5"><label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider">${esc(f.label)} ${req}</label>${input}</div>`;
}

document.addEventListener('change', e => {
  if (e.target.matches('select.selWithOther')) {
    const oInput = e.target.nextElementSibling;
    if (oInput && oInput.classList.contains('otherInput')) {
      const show = e.target.value === '__OTHER__';
      oInput.classList.toggle('hidden', !show);
      oInput.required = show && e.target.required;
      if (show) oInput.focus(); else oInput.value = '';
    }
  }
});

function collectForm(form, schema) {
  const fd = new FormData(form), data = {};
  schema.forEach(f => {
    if (f.type === 'checkbox') { const el = form.querySelector(`[name="${f.id}"]`); data[f.id] = !!(el && el.checked); }
    else if (f.type === 'select' && f.allowOther && fd.get(f.id) === '__OTHER__') data[f.id] = (fd.get(f.id + '__other') || '').trim();
    else data[f.id] = fd.get(f.id) || '';
  });
  return data;
}

function createSlideshowComponent(customSlides) {
  const slides = (customSlides && customSlides.length) ? customSlides : defaultSlides();
  let cIdx = 0, timer = null;

  const wrap = el(`
    <div class="relative w-full rounded-3xl overflow-hidden glass-panel mb-8 group">
      <div id="slideTrack" class="relative h-56 sm:h-72 w-full overflow-hidden">
        ${slides.map((s, i) => `
          <div class="slide-item absolute inset-0 w-full h-full transition-opacity duration-700 ${i === 0 ? 'opacity-100 z-10' : 'opacity-0 z-0'}">
            <img src="${esc(s.image)}" alt="${esc(s.title)}" class="w-full h-full object-cover">
            <div class="absolute inset-0 bg-gradient-to-t from-slate-900/95 via-slate-900/50 to-transparent flex flex-col justify-end p-6 sm:p-8">
              ${s.badge ? `<span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-bold bg-sky-500/90 text-white w-max mb-2">${esc(s.badge)}</span>` : ''}
              ${s.title ? `<h3 class="font-display text-xl sm:text-3xl font-extrabold text-white tracking-tight">${esc(s.title)}</h3>` : ''}
              ${s.desc ? `<p class="text-xs sm:text-sm text-slate-200 mt-1 max-w-xl">${esc(s.desc)}</p>` : ''}
            </div>
          </div>
        `).join('')}
      </div>
      <button id="prevSlide" class="absolute left-3 top-1/2 -translate-y-1/2 z-20 w-10 h-10 rounded-full bg-white/20 hover:bg-white/40 text-white backdrop-blur flex justify-center items-center opacity-0 group-hover:opacity-100 transition-all"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg></button>
      <button id="nextSlide" class="absolute right-3 top-1/2 -translate-y-1/2 z-20 w-10 h-10 rounded-full bg-white/20 hover:bg-white/40 text-white backdrop-blur flex justify-center items-center opacity-0 group-hover:opacity-100 transition-all"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/></svg></button>
      <div id="slideDots" class="absolute bottom-4 right-6 z-20 flex gap-2">
        ${slides.map((_, i) => `<button data-dot="${i}" class="w-2.5 h-2.5 rounded-full transition-all ${i===0?'bg-sky-400 w-7':'bg-white/50'}"></button>`).join('')}
      </div>
    </div>
  `);

  function go(i) {
    cIdx = (i + slides.length) % slides.length;
    wrap.querySelectorAll('.slide-item').forEach((e, idx) => { e.classList.toggle('opacity-100', idx===cIdx); e.classList.toggle('z-10', idx===cIdx); e.classList.toggle('opacity-0', idx!==cIdx); e.classList.toggle('z-0', idx!==cIdx); });
    wrap.querySelectorAll('[data-dot]').forEach((d, idx) => { d.className = idx===cIdx ? 'w-7 h-2.5 rounded-full bg-sky-400 transition-all' : 'w-2.5 h-2.5 rounded-full bg-white/50 transition-all'; });
  }
  function play() { clearInterval(timer); timer = setInterval(() => go(cIdx + 1), 4500); }
  
  wrap.querySelector('#prevSlide').onclick = () => { go(cIdx-1); play(); };
  wrap.querySelector('#nextSlide').onclick = () => { go(cIdx+1); play(); };
  wrap.querySelectorAll('[data-dot]').forEach(d => d.onclick = () => { go(parseInt(d.dataset.dot)); play(); });
  wrap.onmouseenter = () => clearInterval(timer); wrap.onmouseleave = play;
  play(); return wrap;
}

    wrap.querySelector('#statCards').innerHTML = [

    const breakdownCards = [];

    schema.filter(f => f.type === 'select' && (f.options||[]).length).forEach(f => {

      subs.forEach(s => {

        if (val in counts) counts[val]++; else other++;
      });
      const rows = Object.entries(counts).map(([label, v]) => `

          ${extraFields.map(f => {
            if (f.type === 'checkbox') {
              const checked = s.data[f.id] === true || s.data[f.id] === 'true';
              return `<td class="p-3"><button data-id="${s.id}" data-toggle="${f.id}" class="text-xs px-2 py-1 rounded font-bold ${checked?'bg-teal-500 text-white':'bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300'}">${checked?'✓ Ya':'Belum'}</button></td>`;

    table.querySelector('#s').oninput = drawRows;
    table.onclick = e => {
      const b = e.target.closest('button'); if(!b) return;

      if(b.dataset.act==='e') openForm(entry);
      if(b.dataset.act==='v') { DB.updateSubmission(b.dataset.id, {verified: !entry.verified}); drawRows(); drawStats(); }
      if(b.dataset.toggle) {
        const fid = b.dataset.toggle;
        const newData = { ...entry.data, [fid]: !(entry.data[fid] === true || entry.data[fid] === 'true') };
        DB.updateSubmission(entry.id, {data: newData});
        drawRows(); drawStats();
      }
    };
    drawRows(); wrap.querySelector('#pContent').replaceChildren(table);
  }
  drawStats();
  renderList();
  document.getElementById('app').replaceChildren(wrap);
}

              <select id="fType" class="w-full p-2.5 rounded-lg bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white text-sm">

                <option value="textarea">Teks Panjang</option>
                <option value="date">Tanggal</option>
                <option value="select">Pilihan (Dropdown)</option>
                <option value="checkbox">Centang (Ya/Tidak)</option>
              </select>
            </div>

            <div id="optWrap" class="hidden space-y-2">
              <label class="text-xs font-bold text-slate-500 block mb-1">Pilihan Jawaban (satu per baris)</label>
              <textarea id="fOpts" rows="4" placeholder="IPA&#10;IPS&#10;Bahasa" class="w-full p-2.5 rounded-lg bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white text-sm">${esc((f.options || []).join('\n'))}</textarea>
              <label class="flex items-center gap-2 text-sm text-slate-700 dark:text-slate-300"><input id="fAllowOther" type="checkbox" ${f.allowOther ? 'checked' : ''} class="rounded"> Izinkan jawaban "Lainnya"</label>

            <label class="flex items-center gap-2 text-sm text-slate-700 dark:text-slate-300"><input id="fRequired" type="checkbox" ${f.required ? 'checked' : ''} class="rounded"> Wajib diisi</label>

            <div>
              <label class="text-xs font-bold text-slate-500 block mb-2">Siapa yang melihat/mengisi field ini?</label>

        </div>

    const typeSel = overlay.querySelector('#fType');

      const label = overlay.querySelector('#fLabel').value.trim();

      const required = overlay.querySelector('#fRequired').checked;

function resizeImageFile(file, maxDim = 320) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Gagal membaca file'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('File bukan gambar yang valid'));
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) { height = Math.round(height * (maxDim / width)); width = maxDim; }
        else if (height > maxDim) { width = Math.round(width * (maxDim / height)); height = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function renderSlideshowAdmin(container) {
  const s = DB.getSettings();
  let slides = JSON.parse(JSON.stringify(s.slides && s.slides.length ? s.slides : defaultSlides()));

  const wrap = el(`
    <div class="space-y-5">
      <div class="flex flex-wrap justify-between items-center gap-3">
        <div>
          <h3 class="font-display text-lg font-bold text-slate-900 dark:text-white">Slideshow Beranda</h3>

        </div>
        <button id="addSlide" type="button" class="px-4 py-2 bg-indigo-500 text-white rounded-xl font-bold text-sm whitespace-nowrap">+ Tambah Slide</button>
      </div>
      <div id="slideList" class="space-y-4"></div>
      <button id="saveSlides" type="button" class="px-4 py-2 bg-emerald-500 text-white font-bold rounded-xl text-sm">Simpan Slideshow</button>
    </div>
  `);

  function draw() {
    const list = wrap.querySelector('#slideList');
    if (!slides.length) {
      list.innerHTML = `<p class="text-sm text-slate-500">Belum ada slide. Klik "Tambah Slide" untuk menambahkan foto.</p>`;
      return;
    }
    list.innerHTML = '';
    slides.forEach((sl, i) => {
      const card = el(`
        <div class="p-4 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-2xl flex flex-col sm:flex-row gap-4">
          <div class="w-full sm:w-40 h-28 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 flex items-center justify-center overflow-hidden flex-shrink-0">
            ${sl.image ? `<img class="w-full h-full object-cover" src="${esc(sl.image)}">` : `<span class="text-xs text-slate-400">Belum ada foto</span>`}
          </div>
          <div class="flex-1 space-y-2 min-w-0">
            <input type="file" accept="image/*" data-act="file" class="text-xs text-slate-600 dark:text-slate-300 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-indigo-500 file:text-white hover:file:bg-indigo-600 file:cursor-pointer">
            <input type="text" data-act="badge" value="${esc(sl.badge||'')}" placeholder="Label singkat (contoh: Fasilitas)" class="w-full p-2 rounded-lg bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-sm text-slate-900 dark:text-white">
            <input type="text" data-act="title" value="${esc(sl.title||'')}" placeholder="Judul slide" class="w-full p-2 rounded-lg bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-sm font-bold text-slate-900 dark:text-white">
            <textarea data-act="desc" rows="2" placeholder="Deskripsi singkat" class="w-full p-2 rounded-lg bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-sm text-slate-900 dark:text-white">${esc(sl.desc||'')}</textarea>
          </div>
          <div class="flex sm:flex-col gap-2 flex-shrink-0">
            <button type="button" data-act="up" class="px-2 py-1 text-xs font-bold rounded-lg bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300 disabled:opacity-30" ${i===0?'disabled':''}>↑</button>
            <button type="button" data-act="down" class="px-2 py-1 text-xs font-bold rounded-lg bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300 disabled:opacity-30" ${i===slides.length-1?'disabled':''}>↓</button>
            <button type="button" data-act="remove" class="px-2 py-1 text-xs font-bold rounded-lg bg-rose-100 dark:bg-rose-500/20 text-rose-600 dark:text-rose-400">Hapus</button>
          </div>
        </div>
      `);
      card.querySelector('[data-act="file"]').onchange = async e => {
        const file = e.target.files[0];
        if (!file) return;
        try {
          slides[i].image = await resizeImageFile(file, 1280);
          draw();
        } catch (err) { toast(err.message || 'Gagal memuat gambar', 'error'); }
      };
      card.querySelector('[data-act="badge"]').oninput = e => slides[i].badge = e.target.value;
      card.querySelector('[data-act="title"]').oninput = e => slides[i].title = e.target.value;
      card.querySelector('[data-act="desc"]').oninput = e => slides[i].desc = e.target.value;
      card.querySelector('[data-act="up"]').onclick = () => { if (i > 0) { [slides[i-1], slides[i]] = [slides[i], slides[i-1]]; draw(); } };
      card.querySelector('[data-act="down"]').onclick = () => { if (i < slides.length-1) { [slides[i+1], slides[i]] = [slides[i], slides[i+1]]; draw(); } };
      card.querySelector('[data-act="remove"]').onclick = () => { slides.splice(i, 1); draw(); };
      list.appendChild(card);
    });
  }

  wrap.querySelector('#addSlide').onclick = () => {
    slides.push({ image: '', badge: '', title: '', desc: '' });
    draw();
  };

  wrap.querySelector('#saveSlides').onclick = () => {
    if (slides.some(sl => !sl.image)) { toast('Setiap slide harus memiliki foto', 'error'); return; }
    DB.saveSettings({ ...s, slides });
    toast('Slideshow tersimpan', 'success');
  };

  draw();
  container.replaceChildren(wrap);
}

      <div>
        <label class="text-xs font-bold text-slate-500 block mb-1">Judul Halaman Pendaftaran</label>
        <input type="text" id="sft" value="${esc(s.formTitle)}" placeholder="Contoh: Formulir Pendaftaran" class="w-full p-2 rounded-lg bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white">
      </div>
      <div>
        <label class="text-xs font-bold text-slate-500 block mb-1">Logo / Foto Sekolah</label>
        <div class="flex items-center gap-4">
          <div id="logoPreviewBox" class="w-16 h-16 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 flex items-center justify-center overflow-hidden flex-shrink-0">
            ${pendingLogo ? `<img id="logoPreview" src="${pendingLogo}" class="w-full h-full object-cover">` : `<span id="logoPreview" class="text-xs text-slate-400">Tidak ada</span>`}
          </div>
          <div class="space-y-2">
            <input type="file" id="sl" accept="image/*" class="text-xs text-slate-600 dark:text-slate-300 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-indigo-500 file:text-white hover:file:bg-indigo-600 file:cursor-pointer">
            <button type="button" id="slRemove" class="block text-xs text-rose-500 font-bold ${pendingLogo ? '' : 'hidden'}">Hapus Foto</button>
          </div>
        </div>
      </div>
      <button type="submit" class="px-4 py-2 bg-indigo-500 text-white font-bold rounded-xl text-sm">Simpan</button>
    </form>
  `);

  form.querySelector('#sl').onchange = async e => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      pendingLogo = await resizeImageFile(file);
      const box = form.querySelector('#logoPreviewBox');
      box.innerHTML = `<img id="logoPreview" src="${pendingLogo}" class="w-full h-full object-cover">`;
      form.querySelector('#slRemove').classList.remove('hidden');
    } catch (err) { toast(err.message || 'Gagal memuat gambar', 'error'); }
  };
  form.querySelector('#slRemove').onclick = () => {
    pendingLogo = '';
    form.querySelector('#logoPreviewBox').innerHTML = `<span id="logoPreview" class="text-xs text-slate-400">Tidak ada</span>`;
    form.querySelector('#sl').value = '';
    form.querySelector('#slRemove').classList.add('hidden');
  };

  form.onsubmit = e => {
    e.preventDefault();
    DB.saveSettings({
      ...s,
      schoolName: form.querySelector('#sn').value,
      year: form.querySelector('#sy').value,
      formTitle: form.querySelector('#sft').value,
      logo: pendingLogo
    });
    updateHeader();
    toast('Pengaturan tersimpan', 'success');
  };
  container.replaceChildren(form);
}

function renderLogin(role) {
  const isA = role === 'admin';
  const wrap = el(`
    <div class="max-w-sm mx-auto mt-12 glass-panel p-8 rounded-3xl text-center space-y-6">
      <h3 class="font-display font-bold text-2xl text-slate-900 dark:text-white">Login ${isA?'Admin':'Panitia'}</h3>
      <form id="lF" class="space-y-4">
        <input type="password" id="pw" required placeholder="Kata Sandi" class="w-full p-3 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white text-center">
        <button type="submit" class="w-full p-3 bg-${isA?'indigo':'amber'}-500 text-white font-bold rounded-xl">Masuk</button>
      </form>
      <button id="bck" class="text-xs text-slate-500 font-bold">← Batal</button>
    </div>
  `);
  wrap.querySelector('#bck').onclick = () => { currentRole='siswa'; renderApp(); };
  wrap.querySelector('#lF').onsubmit = e => {
    e.preventDefault(); const s = DB.getSettings();
    if (wrap.querySelector('#pw').value === (isA ? s.adminPass : s.panitiaPass)) {
      sessionStorage.setItem(`ppdb_${role}_auth`, '1'); renderApp();
    } else toast('Sandi salah!', 'error');
  };
  document.getElementById('app').replaceChildren(wrap);
}

let currentRole = 'siswa';

function updateHeader() {
  const s = DB.getSettings();
  document.getElementById('schoolName').textContent = s.schoolName;
  document.getElementById('yearTag').textContent = 'PPDB ' + s.year;
  document.getElementById('footerYear').textContent = new Date().getFullYear();
  document.getElementById('roleLabel').textContent = currentRole === 'siswa' ? 'Portal Siswa' : currentRole === 'panitia' ? 'Panel Panitia' : 'Panel Admin';

  const logoImg = document.getElementById('customLogoImg'), defaultIcon = document.getElementById('defaultLogoIcon');
  if (s.logo) { logoImg.src = s.logo; logoImg.classList.remove('hidden'); defaultIcon.classList.add('hidden'); }
  else { logoImg.classList.add('hidden'); logoImg.removeAttribute('src'); defaultIcon.classList.remove('hidden'); }
}

function renderApp() {
  updateHeader();
  if (currentRole === 'siswa') viewSiswa();
  else if (currentRole === 'panitia') viewPanitia();
  else viewAdmin();
}

document.getElementById('themeToggleBtn')?.addEventListener('click', toggleTheme);
document.getElementById('brandHomeBtn').addEventListener('click', () => { currentRole = 'siswa'; renderApp(); });

const setBtn = document.getElementById('settingsBtn'), setMenu = document.getElementById('settingsMenu');
setBtn.addEventListener('click', e => { e.stopPropagation(); setMenu.classList.toggle('hidden'); });
document.querySelectorAll('.role-opt').forEach(b => b.addEventListener('click', () => { currentRole = b.dataset.role; setMenu.classList.add('hidden'); renderApp(); }));
document.addEventListener('click', () => setMenu.classList.add('hidden'));

initTheme();
document.getElementById('app').innerHTML = '<div class="text-center py-20 text-slate-400 dark:text-slate-500">Memuat data dari server...</div>';
loadFromSupabase()
  .then(renderApp)
  .catch(() => {
    document.getElementById('app').innerHTML = '<div class="text-center py-20 text-rose-500 font-bold">Gagal terhubung ke Supabase.<br><span class="font-normal text-sm text-slate-500">Periksa URL/API key dan pastikan tabel ppdb_settings, ppdb_schema, ppdb_submissions sudah dibuat.</span></div>';
  });
</script>
</body>
</html>
